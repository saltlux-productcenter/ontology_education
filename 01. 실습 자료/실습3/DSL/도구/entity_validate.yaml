app:
  description: 추출한 엔티티가 원문에 근거하는지 확인하고 클래스, 속성, 관계의 적합성과 중복 여부를 검증
  icon: ri-git-merge-line
  icon_background: '#14b8a6'
  mode: workflow
  name: entity_validate
  type: agent
  use_icon_as_answer_icon: false
dependencies:
  code_agents: []
  knowledges: []
  node_configs: []
  single_agents: []
  skills: []
  workflow_apps: []
  workflow_mcp_servers: []
  workflow_tools: []
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: Elasticsearch 주소. 끝에 슬래시를 붙이지 않는다
    id: 47221646-da7c-e90a-f0ac-fa04e3c38d06
    name: ES_BASE_URL
    selector:
    - env
    - ES_BASE_URL
    value: http://192.168.250.101:19200
    value_type: string
  - description: 표준 계층 색인 v2.0 KB 인덱스명. 단일 인덱스 또는 단일 인덱스를 가리키는 alias
    id: baded43b-f365-53d5-72ef-ddde34ef82ad
    name: ES_INDEX
    selector:
    - env
    - ES_INDEX
    value: manufacturing_erp
    value_type: string
  - description: Authorization 헤더 값(ApiKey ... 또는 Basic ...). 인증 없는 ES 면 빈 문자열. secret
      이라 DSL 을 내보내면 값이 비워진다
    id: 6fd13c7c-f68b-693e-7473-ec0e656b0709
    name: ES_AUTH_HEADER
    selector:
    - env
    - ES_AUTH_HEADER
    value: ''
    value_type: secret
  - description: 다중 테넌트 색인의 tenant_id 값. 빈 문자열이면 tenant 조건을 걸지 않는다
    id: 5affa868-a237-b703-9e1c-e27ef9172cfb
    name: TENANT_ID
    selector:
    - env
    - TENANT_ID
    value: ''
    value_type: string
  features:
    file_upload:
      image:
        detail: high
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: code
      id: start-source-prep-target
      label: ''
      source: start
      sourceHandle: source
      target: prep
      targetHandle: target
      type: custom
    - data:
        sourceType: http-request
        targetType: code
      id: fetch_evidence-source-judge-target
      label: ''
      selected: false
      source: fetch_evidence
      sourceHandle: source
      target: judge
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: if-else
      id: prep-source-gate-target
      label: ''
      source: prep
      sourceHandle: source
      target: gate
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: http-request
      id: gate-ok-fetch_evidence-target
      label: ''
      source: gate
      sourceHandle: ok
      target: fetch_evidence
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: code
      id: gate-false-precheck_fail-target
      label: ''
      source: gate
      sourceHandle: 'false'
      target: precheck_fail
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: variable-aggregator
      id: judge-source-merge-target
      label: ''
      selected: false
      source: judge
      sourceHandle: source
      target: merge
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: variable-aggregator
      id: precheck_fail-source-merge-target
      label: ''
      selected: false
      source: precheck_fail
      sourceHandle: source
      target: merge
      targetHandle: target
      type: custom
    - data:
        sourceType: variable-aggregator
        targetType: code
      id: merge-source-unpack-target
      label: ''
      selected: false
      source: merge
      sourceHandle: source
      target: unpack
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: end
      id: unpack-source-done-target
      label: ''
      selected: false
      source: unpack
      sourceHandle: source
      target: done
      targetHandle: target
      type: custom
    nodes:
    - computedPosition:
        x: 80
        y: 140
        z: 0
      data:
        desc: instances 와 extraction_spec 을 받는다. 둘 다 필수이며 원소 구조는 인자 설명에만 있다
        display_variables:
        - instances
        - extraction_spec
        retry_config:
          max_retries: 3
          retry_enabled: false
          retry_interval: 300
        title: 인자 받기
        type: start
        variables:
        - default: ''
          description: '판정할 후보 인스턴스의 JSON 배열이다. 원소는 객체이며 필드는 temp_id(배치 안에서 유일한 문자열),
            class(extraction_spec.classes 의 name), label(원문 표기의 이름), aliases(선택, 문자열
            배열), attributes(선택, 배열: property, value, unit, evidence), relations(선택,
            배열: property 와 target_temp_id, 또는 property 와 target_class·target_label,
            그리고 evidence), evidence(필수, 배열: chunk_id, quote, 선택 document_id), cq_refs(선택,
            cq_id 배열), confidence(0에서 1 사이 숫자)다. evidence 의 chunk_id 는 인용문을 복사한 도구
            결과 항목의 chunk_id 를 그대로 쓰고, quote 는 그 항목 text 에서 연속된 구절 하나를 한 글자도 바꾸지 않고
            복사한다. 기호와 공백을 뺀 quote 가 8자 이상이어야 한다. 여러 구절을 생략 부호로 잇지 않는다. attributes
            와 relations 의 evidence 가 비어 있으면 인스턴스의 evidence 를 쓴다. unit 은 원문 표기 그대로
            쓰고 환산하지 않는다. 한 번에 최대 15건이다. 예시 1: [{"temp_id":"t1","class":"대출규정","label":"일반자료
            대출","evidence":[{"chunk_id":"doc-2026-library-rules-001:v3:parent:0004","quote":"일반자료는
            1인 5책까지 14일 동안 대출할 수 있다"}],"attributes":[{"property":"대출기간","value":"14","unit":"일","evidence":[]}],"relations":[{"property":"적용대상","target_class":"이용자","target_label":"정회원","evidence":[]}],"cq_refs":["CQ1"],"confidence":0.9}].
            예시 2: [{"temp_id":"t2","class":"대출규정","label":"연체료 부과","evidence":[{"chunk_id":"doc-2026-library-rules-001:v3:parent:0006","quote":"제12조(연체료의
            부과)"}],"attributes":[{"property":"연체료","value":"100","unit":"원","evidence":[{"chunk_id":"doc-2026-library-rules-001:v3:child:0031","quote":"반납
            예정일을 넘긴 자료 1책당 1일 100원의 연체료를 부과한다"}]}],"confidence":0.85}]. 도구 결과에 있는
            chunk_id 와 원문 구절만 쓰고 근거나 값을 지어내지 않는다.'
          label: 후보 인스턴스
          required: true
          type: array
          variable: instances
        - default: ''
          description: '추출 명세 JSON 객체다. classes(필수, 배열: name, label_ko, definition,
            aliases, parent), properties(필수, 배열: name, kind, domain, range, unit_expected),
            cq_map(선택, 배열: cq_id, question, answer_class, required_properties)으로 이뤄진다.
            kind 는 attribute 또는 relation 이다. domain 은 클래스 name 또는 그 배열이다. range 는
            relation 이면 클래스 name 또는 그 배열이고, attribute 면 string, number, date, boolean
            가운데 하나다. unit_expected 는 허용 단위 문자열 또는 그 배열이다. parent 는 상위 클래스 name 이며
            domain 과 range 판정에서 하위 클래스를 허용하는 데 쓴다. 한 작업 안에서는 처음 만든 명세를 바꾸지 않고 매 호출에
            같은 값을 넣는다. 예시 1: {"classes":[{"name":"대출규정","label_ko":"대출 규정","definition":"자료
            대출의 조건과 기간을 정한 규정","aliases":["대출 기준"]},{"name":"이용자","label_ko":"이용자","definition":"도서관
            자료를 대출하거나 열람하는 사람","aliases":["회원"]}],"properties":[{"name":"대출기간","kind":"attribute","domain":"대출규정","range":"number","unit_expected":["일"]},{"name":"적용대상","kind":"relation","domain":"대출규정","range":"이용자"}],"cq_map":[{"cq_id":"CQ1","question":"일반자료의
            대출기간은 며칠인가","answer_class":"대출규정","required_properties":["대출기간"]}]}. 예시
            2: {"classes":[{"name":"대출규정","label_ko":"대출 규정","definition":"자료 대출의
            조건과 기간을 정한 규정","aliases":[]},{"name":"자료","label_ko":"자료","definition":"도서관이
            소장한 도서와 매체","aliases":["소장 자료"]},{"name":"향토자료","label_ko":"향토 자료","definition":"지역의
            역사와 문화를 기록한 자료","aliases":[],"parent":"자료"}],"properties":[{"name":"연체료","kind":"attribute","domain":"대출규정","range":"number","unit_expected":"원"},{"name":"소장처","kind":"attribute","domain":"자료","range":"string"}],"cq_map":[{"cq_id":"CQ2","question":"연체료는
            하루에 얼마인가","answer_class":"대출규정","required_properties":["연체료"]}]}. 사용자가
            준 CQ 와 ORSD 에서 도출한 클래스와 속성만 쓰고 명세를 지어내거나 호출마다 바꾸지 않는다.'
          label: 추출 명세
          required: true
          type: object
          variable: extraction_spec
      dimensions:
        height: 164
        width: 280
