      isParent: false
      position:
        x: 80
        y: 140
      resizing: false
      selected: false
      type: custom
    - computedPosition:
        x: 460
        y: 140
        z: 0
      data:
        code: "\nWARN = {'spec_invalid': ['extraction_spec 의 classes 가 비었거나 properties\
          \ 가 배열이 아니다', '인자 설명의 구조대로 extraction_spec 을 고쳐 다시 호출한다'], 'too_many_instances':\
          \ ['instances 가 {n}건으로 상한 15건을 넘는다', '15건 이하로 나눠 호출한다'], 'no_evidence_supplied':\
          \ ['chunk_id 가 있는 evidence 가 하나도 없다', '검색·조회 도구로 근거를 먼저 확보하고 evidence 를\
          \ 채워 다시 호출한다'], 'too_many_evidence_chunks': ['서로 다른 근거 chunk_id 가 {n}개로\
          \ 상한 60개를 넘는다', '배치를 나눠 호출한다'], 'evidence_fetch_failed': ['근거 chunk 조회(_mget)가\
          \ 실패해 판정하지 않았다(HTTP {code})', '한 번만 다시 호출하고, 또 실패하면 사용자에게 알린다'], 'result_trimmed':\
          \ ['결과 길이 상한 8,000자에 맞춰 issue 를 빼거나 cq_coverage 의 instance_ids 를 1건으로 줄였다(뺀\
          \ issue {n}건)', '빠진 issue 는 decisions 의 issue_codes 와 issue_total 로 확인하고,\
          \ 고친 뒤 다시 호출하면 남은 issue 가 나온다'], 'es_base_url_missing': ['환경변수 ES_BASE_URL\
          \ 가 비었거나 CHANGE-ME 로 남아 있어 조회하지 않았다', '이것은 색인에 자료가 없는 것이 아니라 설정 오류다. 다시\
          \ 호출하지 말고 사용자에게 알린다'], 'es_index_missing': ['환경변수 ES_INDEX 가 비었거나 CHANGE-ME\
          \ 로 남아 있어 조회하지 않았다', '이것은 색인에 자료가 없는 것이 아니라 설정 오류다. 다시 호출하지 말고 사용자에게 알린다'],\
          \ 'es_auth_header_missing': ['환경변수 ES_AUTH_HEADER 가 CHANGE-ME 로 남아 있어 조회하지\
          \ 않았다', '이것은 색인에 자료가 없는 것이 아니라 설정 오류다. 다시 호출하지 말고 사용자에게 알린다'], 'tenant_id_missing':\
          \ ['환경변수 TENANT_ID 가 CHANGE-ME 로 남아 있어 조회하지 않았다', '이것은 색인에 자료가 없는 것이 아니라\
          \ 설정 오류다. 다시 호출하지 말고 사용자에게 알린다']}\n\n\ndef _to_int(value):\n    try:\n \
          \       return int(value)\n    except Exception:\n        return 0\n\n\n\
          def _parse_json(raw):\n    import json\n    if isinstance(raw, (dict, list)):\n\
          \        return raw\n    if not raw:\n        return None\n    try:\n  \
          \      return json.loads(raw)\n    except Exception:\n        return None\n\
          \n\ndef _http_failed(status_code, data):\n    code = _to_int(status_code)\n\
          \    return code == 0 or code >= 400 or not isinstance(data, dict)\n\n\n\
          def _hits_of(data):\n    if not isinstance(data, dict):\n        return\
          \ []\n    outer = data.get(\"hits\")\n    inner = outer.get(\"hits\") if\
          \ isinstance(outer, dict) else None\n    return inner if isinstance(inner,\
          \ list) else []\n\n\ndef _total_of(data):\n    if not isinstance(data, dict):\n\
          \        return 0\n    outer = data.get(\"hits\")\n    total = outer.get(\"\
          total\") if isinstance(outer, dict) else None\n    if isinstance(total,\
          \ dict):\n        return _to_int(total.get(\"value\"))\n    return _to_int(total)\n\
          \n\ndef _wtext(code, **values):\n    pair = WARN.get(code) or [\"\", \"\"\
          ]\n    fact = pair[0]\n    for key, value in values.items():\n        fact\
          \ = fact.replace(\"{\" + key + \"}\", str(value))\n    text = code + \"\
          : \" + fact\n    if pair[1]:\n        text = text + \". \" + pair[1]\n \
          \   return text\n\n\ndef _size(payload):\n    import json\n    return len(json.dumps(payload,\
          \ ensure_ascii=False))\n\nCONFIG_CHECKS = [['es_base_url', 'es_base_url_missing',\
          \ True], ['es_index', 'es_index_missing', True], ['es_auth_header', 'es_auth_header_missing',\
          \ False], ['tenant_id', 'tenant_id_missing', False]]\n\n\ndef _config_error(values):\n\
          \    missing = []\n    for name, code, empty_is_unset in CONFIG_CHECKS:\n\
          \        raw = values.get(name)\n        text = str(raw if raw is not None\
          \ else \"\").strip()\n        if (not text and empty_is_unset) or text.startswith(\"\
          CHANGE-ME\"):\n            missing.append(_wtext(code))\n    return \";\
          \ \".join(missing)\n\n\ndef _level_filters(level, tenant_id):\n    filters\
          \ = [{\"term\": {\"chunk_level\": level}},\n               {\"term\": {\"\
          is_latest\": True}},\n               {\"term\": {\"lifecycle_state\": \"\
          active\"}}]\n    tenant = str(tenant_id if tenant_id is not None else \"\
          \").strip()\n    if tenant and not tenant.startswith(\"CHANGE-ME\"):\n \
          \       filters.append({\"term\": {\"tenant_id\": tenant}})\n    return\
          \ filters\n\ndef main(instances, extraction_spec, es_base_url, es_index,\
          \ es_auth_header, tenant_id):\n    MAX_INSTANCES = 15\n    MAX_CHUNKS =\
          \ 60\n    SOURCE_FIELDS = ['chunk_id', 'document_id', 'chunk_level', 'parent_chunk_id',\
          \ 'doc_version', 'is_latest', 'lifecycle_state', 'tenant_id', 'title', 'page_start',\
          \ 'page_end', 'content']\n    NO_CANDIDATES_ID = '__no_candidates__'\n\n\
          \    config_error = _config_error({\"es_base_url\": es_base_url, \"es_index\"\
          : es_index,\n                                  \"es_auth_header\": es_auth_header,\
          \ \"tenant_id\": tenant_id})\n    errors = []\n    spec = extraction_spec\
          \ if isinstance(extraction_spec, dict) else {}\n    classes = spec.get(\"\
          classes\")\n    properties = spec.get(\"properties\")\n    if not isinstance(classes,\
          \ list) or not classes or not isinstance(properties, list):\n        errors.append(_wtext(\"\
          spec_invalid\"))\n    items = instances if isinstance(instances, list) else\
          \ []\n    if len(items) > MAX_INSTANCES:\n        errors.append(_wtext(\"\
          too_many_instances\", n=len(items)))\n\n    chunk_ids = []\n\n    def collect(evidence):\n\
          \        if not isinstance(evidence, list):\n            return\n      \
          \  for entry in evidence:\n            if not isinstance(entry, dict):\n\
          \                continue\n            value = entry.get(\"chunk_id\")\n\
          \            chunk_id = str(value).strip() if value is not None else \"\"\
          \n            if chunk_id and chunk_id not in chunk_ids:\n             \
          \   chunk_ids.append(chunk_id)\n\n    for item in items:\n        if not\
          \ isinstance(item, dict):\n            continue\n        collect(item.get(\"\
          evidence\"))\n        for key in (\"attributes\", \"relations\"):\n    \
          \        entries = item.get(key)\n            if isinstance(entries, list):\n\
          \                for entry in entries:\n                    if isinstance(entry,\
          \ dict):\n                        collect(entry.get(\"evidence\"))\n   \
          \ if not chunk_ids:\n        errors.append(_wtext(\"no_evidence_supplied\"\
          ))\n    elif len(chunk_ids) > MAX_CHUNKS:\n        errors.append(_wtext(\"\
          too_many_evidence_chunks\", n=len(chunk_ids)))\n    chunk_ids.sort()\n \
          \   mget_docs = [{\"_id\": chunk_id, \"_source\": list(SOURCE_FIELDS)} for\
          \ chunk_id in chunk_ids[:MAX_CHUNKS]]\n    if not mget_docs:\n        mget_docs\
          \ = [{\"_id\": NO_CANDIDATES_ID, \"_source\": [\"chunk_id\"]}]\n    return\
          \ {\"mget_docs\": mget_docs, \"evidence_chunk_count\": len(chunk_ids),\n\
          \            \"config_error\": config_error, \"arg_error\": \"; \".join(errors)}\n"
        code_language: python3
        desc: 배치 단위 거절 4종과 환경변수를 점검하고, 서로 다른 근거 chunk_id 를 모아 _mget docs 를 만든다
        outputs:
