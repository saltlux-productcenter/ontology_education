          \    data = payload if isinstance(payload, dict) else {}\n    out = {}\n\
          \    for name, kind in FIELDS:\n        value = data.get(name)\n       \
          \ if kind == \"string\":\n            out[name] = str(value) if value is\
          \ not None else \"\"\n        elif kind == \"number\":\n            try:\n\
          \                out[name] = int(value)\n            except Exception:\n\
          \                out[name] = 0\n        elif kind == \"object\":\n     \
          \       out[name] = value if isinstance(value, dict) else {}\n        else:\n\
          \            out[name] = value if isinstance(value, list) else []\n    return\
          \ out\n"
