    name: ES_AUTH_HEADER
    selector:
    - env
    - ES_AUTH_HEADER
    value: ''
    value_type: secret
  - description: 다중 테넌트 색인의 tenant_id 값. 빈 문자열이면 tenant 조건을 걸지 않는다
