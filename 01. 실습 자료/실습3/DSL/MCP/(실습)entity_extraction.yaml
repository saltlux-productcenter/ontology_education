                \                \"page_end\": _to_int(row.get(\"child_page_end\"\
                )),\n                          \"title\": str(row.get(\"title\") or\
                \ \"\")})\n\n    def build(width):\n        out = []\n        for\
                \ item in items:\n            row = item[\"row\"]\n            text,\
                \ offset, truncated, child_excerpt = _excerpt(\n                item[\"\
                body\"], str(row.get(\"child_content\") or \"\"), width, ANCHOR, EXCERPT)\n\
                \            matched = row.get(\"matched_child_ids\") if isinstance(row.get(\"\
                matched_child_ids\"), list) else []\n            score = row.get(\"\
                score\")\n            out.append({\"document_id\": str(row.get(\"\
                document_id\") or \"\"),\n                        \"title\": item[\"\
                title\"],\n                        \"chunk_id\": item[\"chunk_id\"\
                ],\n                        \"section_chunk_id\": str(row.get(\"parent_chunk_id\"\
                ) or \"\"),\n                        \"page_start\": item[\"page_start\"\
                ],\n                        \"page_end\": item[\"page_end\"],\n  \
                \                      \"text\": text,\n                        \"\
                text_offset\": offset,\n                        \"section_chars\"\
                : len(item[\"body\"]),\n                        \"truncated\": truncated,\n\
                \                        \"body_source\": item[\"source\"],\n    \
                \                    \"matched_child_ids\": [str(value) for value\
                \ in matched[:MATCHED_MAX]],\n                        \"child_excerpt\"\
                : child_excerpt,\n                        \"score\": score if isinstance(score,\
                \ (int, float)) else 0})\n        return out\n\n    notes = []\n \
                \   if fetch_failed:\n        notes.append(_wtext(\"section_fetch_failed\"\
                ))\n    elif missing and missing == len(items):\n        notes.append(_wtext(\"\
                section_layer_missing\"))\n    elif missing:\n        notes.append(_wtext(\"\
                section_partial_missing\", n=missing))\n    warnings = notes + info\n\
                \n    width = min(TEXT_MAX, CONTENT_BUDGET // len(items))\n    results\
                \ = build(width)\n    payload[\"status\"] = \"success\"\n    payload[\"\
                results\"] = results\n    payload[\"result_count\"] = len(results)\n\
                \    payload[\"warning\"] = \"; \".join(warnings)\n    steps = 0\n\
                \    while _size(payload) > TARGET and steps < SHRINK_STEPS:\n   \
                \     width = int(width * 0.8)\n        steps += 1\n        results\
                \ = build(width)\n        payload[\"results\"] = results\n    dropped\
                \ = 0\n    while _size(payload) > TARGET and len(results) > 1:\n \
                \       results.pop()\n        dropped += 1\n        payload[\"result_count\"\
                ] = len(results)\n    if steps or dropped:\n        warnings.append(_wtext(\"\
                result_trimmed\", n=dropped))\n    payload[\"result_count\"] = len(results)\n\
                \    payload[\"warning\"] = \"; \".join(warnings)\n    return {\"\
                payload\": payload}\n"
