                ]\n                add_issue(\"merged_duplicate\", rec, \"\", rep[\"\
                temp_id\"])\n        if len(members) > 1:\n            values = {}\n\
                \            for rec in members:\n                for prop_name, pair\
                \ in rec[\"attr_values\"]:\n                    bucket = values.setdefault(prop_name,\
