                \ {}\n    group_keys = []\n    for rec in recs:\n        if rec[\"\
                verdict\"] == \"rejected\":\n            continue\n        key = rec[\"\
                class\"] + SEP + rec[\"label_key\"]\n        if key not in groups:\n\
                \            groups[key] = []\n            group_keys.append(key)\n\
                \        groups[key].append(rec)\n\n    def rank(rec):\n        return\
                \ rec[\"confidence\"] if rec[\"confidence\"] is not None else -1.0\n\
                \n    rep_of = {}\n    for key in group_keys:\n        members = groups[key]\n\
                \        rep = members[0]\n        for rec in members[1:]:\n     \
