          \n    return \"\" if value is None else str(value)\n\n\ndef _cut(text, limit):\n\
          \    body = _txt(text)\n    return body if len(body) <= limit else body[:limit]\n\
          \n\ndef _one_line(text, limit):\n    \"\"\"줄바꿈과 연속 공백을 한 칸으로 줄이고 limit 자에서\
          \ 자른다.\"\"\"\n    return _cut(\" \".join(_txt(text).split()), limit)\n\n\
          \ndef _local_name(iri):\n    \"\"\"IRI 의 마지막 #, /, : 뒤 이름. 없으면 원문.\"\"\"\
          \n    text = _txt(iri).strip()\n    cut = max(text.rfind(\"#\"), text.rfind(\"\
          /\"), text.rfind(\":\"))\n    tail = text[cut + 1:] if cut >= 0 else text\n\
          \    return tail or text\n\n\ndef _list_of(value):\n    \"\"\"dict 원소만 남긴\
          \ 목록. 목록이 아니면 빈 목록.\"\"\"\n    if not isinstance(value, list):\n       \
          \ return []\n    return [item for item in value if isinstance(item, dict)]\n\
          \n\ndef _term_of(statement, key):\n    \"\"\"statement 의 subject, predicate,\
          \ object term. dict 가 아니면 빈 dict.\"\"\"\n    value = statement.get(key)\
          \ if isinstance(statement, dict) else None\n    return value if isinstance(value,\
          \ dict) else {}\n\n\ndef main(payload, fail_payload, stop_payload):\n  \
          \  \"\"\"세 갈래(조회 완료, 인증 실패, 호출 전 중단) 가운데 실행된 갈래의 payload 를 도구 응답 필드로 펼친다.\n\
          \n    건너뛴 갈래의 출력은 변수 풀에 없어 None 이 온다. status 가 든 첫 payload 를 고른다.\"\"\"\n\
          \    SPEC = [('status', 'string'), ('repository', 'string'), ('repository_candidates',\
          \ 'array[string]'), ('mode', 'string'), ('classes', 'array[object]'), ('object_properties',\
          \ 'array[object]'), ('data_properties', 'array[object]'), ('relations',\
          \ 'array[object]'), ('prefixes', 'object'), ('truncated', 'boolean'), ('warning',\
          \ 'string')]\n    chosen = None\n    for candidate in (payload, fail_payload,\
          \ stop_payload):\n        if isinstance(candidate, dict) and _txt(candidate.get(\"\
          status\")):\n            chosen = candidate\n            break\n    if chosen\
          \ is None:\n        chosen = {\"status\": \"error\",\n                 \
          \ \"warning\": \"response_processing_failed: 도구 응답을 조립하지 못했다. 다시 부르지 말고\
          \ 관리자에게 알린다\"}\n    out = {}\n    for name, kind in SPEC:\n        value\
          \ = chosen.get(name)\n        if kind == \"string\":\n            out[name]\
          \ = _txt(value)\n        elif kind == \"number\":\n            try:\n  \
          \              out[name] = int(value)\n            except Exception:\n \
          \               out[name] = 0\n        elif kind == \"boolean\":\n     \
          \       out[name] = value if isinstance(value, bool) else False\n      \
          \  elif kind == \"object\":\n            out[name] = value if isinstance(value,\
          \ dict) else {}\n        elif kind == \"array[string]\":\n            out[name]\
          \ = [_txt(item) for item in value] if isinstance(value, list) else []\n\
          \        else:\n            out[name] = [item for item in value if isinstance(item,\
          \ dict)] if isinstance(value, list) else []\n    return out\n"
