          description: '조회할 Knowledge Studio repository 의 ID 다. kg_list_repositories
            결과에서 can_query 가 true 인 repositories[].id 를 한 글자도 바꾸지 않고 넣는다. 도구 설정에 기본
            repository 가 있으면 빈 문자열 "" 로 둔다(null 금지). 예시 1: manufacturing-kg. 예시 2:
            demo. 사용자가 말한 단서를 그대로 쓰고 값을 지어내지 않는다.'
          label: repository ID
          required: false
          type: text-input
          variable: repository
        - default: ''
          description: '찾을 class 나 property 의 이름 일부다. 스키마 개요가 필요하면 빈 문자열 "" 로 둔다(null
            금지). label 과 IRI 를 함께 대조하며 설명을 덧붙이지 않는다. 예시 1: 펌프. 예시 2: Equipment. 사용자가
            말한 단서를 그대로 쓰고 값을 지어내지 않는다.'
