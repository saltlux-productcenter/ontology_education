    - computedPosition:
        x: 460
        y: 140
        z: 0
      data:
        code: "\ndef _txt(value):\n    \"\"\"None 과 숫자를 포함해 무엇이 오든 문자열로 만든다.\"\"\"\
          \n    return \"\" if value is None else str(value)\n\n\ndef _cut(text, limit):\n\
          \    body = _txt(text)\n    return body if len(body) <= limit else body[:limit]\n\
          \n\ndef _one_line(text, limit):\n    \"\"\"줄바꿈과 연속 공백을 한 칸으로 줄이고 limit 자에서\
          \ 자른다.\"\"\"\n    return _cut(\" \".join(_txt(text).split()), limit)\n\n\
          \ndef _local_name(iri):\n    \"\"\"IRI 의 마지막 #, /, : 뒤 이름. 없으면 원문.\"\"\"\
          \n    text = _txt(iri).strip()\n    cut = max(text.rfind(\"#\"), text.rfind(\"\
          /\"), text.rfind(\":\"))\n    tail = text[cut + 1:] if cut >= 0 else text\n\
          \    return tail or text\n\n\ndef _list_of(value):\n    \"\"\"dict 원소만 남긴\
          \ 목록. 목록이 아니면 빈 목록.\"\"\"\n    if not isinstance(value, list):\n       \
          \ return []\n    return [item for item in value if isinstance(item, dict)]\n\
          \n\ndef _term_of(statement, key):\n    \"\"\"statement 의 subject, predicate,\
          \ object term. dict 가 아니면 빈 dict.\"\"\"\n    value = statement.get(key)\
          \ if isinstance(statement, dict) else None\n    return value if isinstance(value,\
          \ dict) else {}\n\n\ndef _flag(value, default):\n    text = _txt(value).strip().lower()\n\
          \    if text in (\"true\", \"1\", \"yes\", \"y\", \"on\"):\n        return\
          \ \"true\"\n    if text in (\"false\", \"0\", \"no\", \"n\", \"off\"):\n\
          \        return \"false\"\n    return default\n\n\ndef _timeout_ms(value):\n\
          \    try:\n        number = int(float(_txt(value).strip()))\n    except\
          \ Exception:\n        number = 30000\n    return max(1000, min(110000, number))\n\
          \n\ndef _base_url(value):\n    \"\"\"끝의 / 와 /admin 을 떼어 서버 root 로 만든다.\"\
          \"\"\n    text = _txt(value).strip().rstrip(\"/\")\n    if text.lower().endswith(\"\
          /admin\"):\n        text = text[:-len(\"/admin\")].rstrip(\"/\")\n    return\
          \ text\n\n\ndef _config_error(base_url, username):\n    \"\"\"설정이 비었거나 CHANGE-ME\
          \ 자리표시자면 config_missing, 형식이 틀리면 config_invalid.\"\"\"\n    problems = []\n\
          \    lower = base_url.lower()\n    if not base_url or \"CHANGE-ME\" in base_url.upper():\n\
          \        problems.append(\"config_missing: SOR_BASE_URL\")\n    elif not\
          \ (lower.startswith(\"http://\") or lower.startswith(\"https://\")):\n \
          \       problems.append(\"config_invalid: SOR_BASE_URL 은 http:// 또는 https://\
          \ 로 시작해야 한다\")\n    user = _txt(username).strip()\n    if not user or \"\
          CHANGE-ME\" in user.upper():\n        problems.append(\"config_missing:\
          \ SOR_USERNAME\")\n    if not problems:\n        return \"\"\n    return\
          \ (\"; \".join(problems) + \". 도구 설정의 환경변수를 채운 뒤 다시 부른다. 데이터가 없는 것이 아니라\
          \ \"\n            \"설정 오류이므로 인자를 바꿔 다시 부르지 않는다\")\n\n\ndef _q(value):\n\
          \    import urllib.parse\n    return urllib.parse.quote(_txt(value), safe=\"\
          \")\n\n\ndef _build_url(base_url, path, params):\n    \"\"\"params 는 (이름,\
          \ 값) 목록이다. 값은 전부 퍼센트 인코딩한다. (url, query string 길이).\"\"\"\n    query = \"\
          &\".join(_q(key) + \"=\" + _q(value) for key, value in params)\n    return\
          \ base_url + path + (\"?\" + query if query else \"\"), len(query)\n\n\n\
          def _abs_iri(text):\n    \"\"\"절대 IRI(http, https, urn)면 (IRI, \"\"), 아니면\
          \ (\"\", 사유).\"\"\"\n    raw = _txt(text).strip()\n    if raw.startswith(\"\
          <\") and raw.endswith(\">\") and len(raw) > 2:\n        raw = raw[1:-1].strip()\n\
          \    if not raw:\n        return \"\", \"비어 있다\"\n    lower = raw.lower()\n\
          \    ok = False\n    for scheme in (\"http://\", \"https://\", \"urn:\"\
          ):\n        if lower.startswith(scheme) and len(raw) > len(scheme):\n  \
          \          ok = True\n    if not ok:\n        return \"\", \"절대 IRI(http,\
          \ https, urn)가 아니다\"\n    for ch in (\"<\", \">\", '\"', \" \", \"\\t\"\
          , \"\\n\", \"\\r\", \"{\", \"}\", \"|\", \"^\", \"`\", \"\\\\\"):\n    \
          \    if ch in raw:\n            return \"\", \"IRI 에 쓸 수 없는 문자가 있다\"\n \
          \   return raw, \"\"\n\n\ndef _stop(warning, repository, extra):\n    \"\
          \"\"호출 없이 끝낼 때의 응답.\"\"\"\n    payload = {\"status\": \"error\", \"repository\"\
          : _txt(repository), \"repository_candidates\": [],\n               \"warning\"\
          : warning}\n    payload.update(extra)\n    return payload\n\n\ndef _lit(text):\n\
          \    \"\"\"SPARQL 문자열 literal 로 감싼다. 역슬래시, 큰따옴표, 줄바꿈을 escape 한다.\"\"\"\n\
          \    body = _txt(text)\n    body = body.replace(\"\\\\\", \"\\\\\\\\\").replace('\"\
          ', '\\\\\"')\n    body = body.replace(\"\\r\\n\", \"\\n\").replace(\"\\\
          r\", \"\\n\").replace(\"\\n\", \"\\\\n\")\n    return '\"' + body + '\"\
          '\n\n\ndef main(repository_arg, name, class_iri, base, username, default_repo,\
          \ inferred, federation, timeout_ms):\n    \"\"\"이름과 class_iri 를 검사하고 label\
          \ 검색 SPARQL 3건(정확 일치, 포함, IRI 끝 이름)의 주소를 만든다.\"\"\"\n    PREFIXES = 'PREFIX\
          \ rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\
          \ PREFIX skos: <http://www.w3.org/2004/02/skos/core#> '\n    LIMIT = 20\
          \ + 1\n    base_url = _base_url(base)\n    repository = _txt(repository_arg).strip()\
          \ or _txt(default_repo).strip()\n    target = \" \".join(_txt(name).split())\n\
          \    out = {\"base_url\": base_url, \"repository\": repository, \"route\"\
          : \"go\", \"stop_payload\": {},\n           \"name\": target, \"class_iri\"\
          : \"\",\n           \"repos_url\": _build_url(base_url, \"/api/v1/sparql/repositories\"\
          , [])[0],\n           \"exact_url\": \"\", \"contains_url\": \"\", \"iri_url\"\
          : \"\"}\n    empty = {\"candidates\": [], \"candidate_count\": 0}\n    error\
          \ = _config_error(base_url, username)\n    if not error and not target:\n\
          \        error = \"name_required: name 이 비었다. 사용자가 말한 대상의 이름을 넣어 다시 부른다\"\
          \n    class_text = _txt(class_iri).strip()\n    class_value = \"\"\n   \
          \ if not error and class_text:\n        class_value, reason = _abs_iri(class_text)\n\
          \        if not class_value:\n            error = (\"invalid_iri: class_iri\
          \ \" + _cut(class_text, 200) + \" 는 \" + reason + \". \"\n             \
          \        \"kg_describe_schema 결과의 classes[].iri 를 그대로 넣거나 빈 문자열로 둔다. prefix\
          \ 표기는 \"\n                     \"kg_describe_schema 의 prefixes 로 펼쳐 넣는다\"\
          )\n    out[\"class_iri\"] = class_value\n    if error:\n        out[\"route\"\
          ] = \"stop\"\n        out[\"stop_payload\"] = _stop(error, repository, empty)\n\
          \        return out\n    if not repository:\n        return out\n\n    lower\
          \ = target.lower()\n    class_filter = (\" ?s rdf:type/rdfs:subClassOf*\
          \ <\" + class_value + \"> .\") if class_value else \"\"\n    select = 'SELECT\
          \ ?s (SAMPLE(?l) AS ?label) (GROUP_CONCAT(STR(?t); separator=\" \") AS ?types)\
          \ WHERE { '\n    labels = \"VALUES ?p { rdfs:label skos:prefLabel skos:altLabel\
          \ } \"\n    literal = _lit(target)\n    exact = (PREFIXES + select + labels\n\
          \             + \"VALUES ?l { \" + literal + \" \" + literal + \"@ko \"\
          \ + literal + \"@en } \"\n             + \"?s ?p ?l .\" + class_filter +\
          \ \" OPTIONAL { ?s rdf:type ?t } \"\n             + \"} GROUP BY ?s LIMIT\
          \ \" + str(LIMIT))\n    contains = (PREFIXES + select + labels\n       \
          \         + \"?s ?p ?l . FILTER(CONTAINS(LCASE(STR(?l)), \" + _lit(lower)\
          \ + \"))\" + class_filter\n                + \" OPTIONAL { ?s rdf:type ?t\
          \ } \"\n                + \"} GROUP BY ?s LIMIT \" + str(LIMIT))\n    variants\
          \ = []\n    for variant in (lower, lower.replace(\" \", \"_\"), lower.replace(\"\
          \ \", \"\")):\n        if variant and variant not in variants:\n       \
          \     variants.append(variant)\n    ends = []\n    for variant in variants:\n\
          \        for separator in (\"/\", \"#\", \":\"):\n            ends.append(\"\
          STRENDS(LCASE(STR(?s)), \" + _lit(separator + variant) + \")\")\n    iri_query\
          \ = (PREFIXES\n                 + 'SELECT ?s (SAMPLE(?lb) AS ?label) (GROUP_CONCAT(STR(?t);\
          \ separator=\" \") AS ?types) WHERE { '\n                 + \"?s rdf:type\
          \ ?t . FILTER(isIRI(?s) && (\" + \" || \".join(ends) + \"))\" + class_filter\n\
          \                 + \" OPTIONAL { ?s rdfs:label ?lb } \"\n             \
          \    + \"} GROUP BY ?s LIMIT \" + str(LIMIT))\n\n    timeout = _timeout_ms(timeout_ms)\n\
          \    short_timeout = min(timeout, 10000)\n    infer = _flag(inferred, \"\
          true\")\n    fed = _flag(federation, \"false\")\n    path = \"/\" + _q(repository)\
          \ + \"/sparql\"\n    longest = 0\n    for key, query, limit_ms in ((\"exact_url\"\
          , exact, timeout), (\"contains_url\", contains, short_timeout),\n      \
          \                           (\"iri_url\", iri_query, short_timeout)):\n\
          \        url, size = _build_url(base_url, path, [(\"query\", query), (\"\
          includeInferred\", infer),\n                                           \
          \     (\"includeFederation\", fed), (\"timeout\", str(limit_ms))])\n   \
