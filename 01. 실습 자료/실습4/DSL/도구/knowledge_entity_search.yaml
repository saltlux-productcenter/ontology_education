    nodes:
    - computedPosition:
        x: 80
        y: 140
        z: 0
      data:
        desc: repository ID(비우면 기본값), 이름(필수), class IRI(선택)를 받는다
        display_variables:
        - repository
        - name
        - class_iri
        retry_config:
          max_retries: 3
          retry_enabled: false
          retry_interval: 300
        title: 시작
        type: start
        variables:
        - default: ''
          description: '조회할 Knowledge Studio repository 의 ID 다. kg_list_repositories
            결과에서 can_query 가 true 인 repositories[].id 를 한 글자도 바꾸지 않고 넣는다. 도구 설정에 기본
            repository 가 있으면 빈 문자열 "" 로 둔다(null 금지). 예시 1: manufacturing-kg. 예시 2:
            demo. 사용자가 말한 단서를 그대로 쓰고 값을 지어내지 않는다.'
          label: repository ID
          required: false
          type: text-input
          variable: repository
        - default: ''
          description: '찾을 instance 의 이름이다. 사용자가 말한 이름을 그대로 넣고 낱말을 바꾸거나 설명을 덧붙이지 않는다.
            정확 일치, 포함 검색, IRI 끝 이름 일치를 함께 본다. IRI 는 넣지 않는다. 예시 1: 1번 펌프. 예시 2: P-101.
            사용자가 말한 단서를 그대로 쓰고 값을 지어내지 않는다.'
          label: instance 이름
          required: true
          type: text-input
          variable: name
        - default: ''
          description: '후보를 좁힐 class 의 절대 IRI(http, https, urn)다. kg_describe_schema
            결과의 classes[].iri 를 그대로 넣고, 모르면 빈 문자열 "" 로 둔다(null 금지). prefix 표기(ex:Pump)는
            받지 않는다. 예시 1: https://example.org/onto#Pump. 예시 2: https://example.org/onto#Equipment.
            사용자가 말한 단서를 그대로 쓰고 값을 지어내지 않는다.'
          label: class IRI
          required: false
          type: text-input
          variable: class_iri
