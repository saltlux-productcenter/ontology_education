          , [])[0]}\n    error = _config_error(base_url, username)\n    if error:\n\
          \        out[\"route\"] = \"stop\"\n        out[\"stop_payload\"] = {\"\
          status\": \"error\", \"repositories\": [], \"count\": 0,\n             \
          \                  \"default_repository\": default_repository, \"warning\"\
          : error}\n    return out\n"
