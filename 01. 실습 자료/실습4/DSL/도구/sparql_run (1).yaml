    - data:
        sourceType: code
        targetType: code
      id: assemble-source-merge-target
      label: ''
      selected: false
      source: assemble
      sourceHandle: source
      target: merge
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: end
      id: merge-source-done-target
      label: ''
      selected: false
      source: merge
      sourceHandle: source
      target: done
      targetHandle: target
      type: custom
    nodes:
    - computedPosition:
        x: 80
        y: 140
        z: 0
      data:
        desc: repository ID(비우면 기본값)와 SPARQL 조회문 한 개를 받는다. 추론, timeout, 결과 상한은 인자에
          없다
        display_variables:
        - repository
        - sparql
        retry_config:
          max_retries: 3
          retry_enabled: false
          retry_interval: 300
        title: 시작
        type: start
        variables:
        - default: ''
          description: '조회할 Knowledge Studio repository 의 ID 다. kg_list_repositories
            결과에서 can_query 가 true 인 repositories[].id 를 한 글자도 바꾸지 않고 넣는다. 도구 설정에 기본
            repository 가 있으면 빈 문자열 "" 로 둔다(null 금지). 예시 1: manufacturing-kg. 예시 2:
            demo. 사용자가 말한 단서를 그대로 쓰고 값을 지어내지 않는다.'
          label: repository ID
          required: false
          type: text-input
          variable: repository
        - default: ''
          description: '실행할 SPARQL 조회문 한 개다(SELECT, ASK, CONSTRUCT, DESCRIBE). PREFIX
            선언을 포함한 완전한 문장으로 넣고, IRI 는 앞선 도구로 확인한 값만 쓴다. 예시 1: PREFIX ex: <https://example.org/onto#>
            SELECT ?s WHERE { ?s a ex:Pump } LIMIT 20. 예시 2: ASK { <https://example.org/data/P-101>
            ?p ?o }. 사용자가 말한 단서를 그대로 쓰고 값을 지어내지 않는다.'
          label: SPARQL 조회문
          required: true
          type: paragraph
          variable: sparql
      dimensions:
        height: 164
        width: 280
      dragging: false
      events: {}
      handleBounds:
        source:
        - height: 8
          id: source
          nodeId: start
          position: right
          type: source
          width: 8
          x: 277.20001220703125
          y: 22.800018310546875
        target: null
      id: start
      initialized: false
      isParent: false
      position:
        x: 80
        y: 140
      resizing: false
      selected: false
      type: custom
    - computedPosition:
        x: 460
        y: 140
        z: 0
      data:
        code: "\ndef _txt(value):\n    \"\"\"None 과 숫자를 포함해 무엇이 오든 문자열로 만든다.\"\"\"\
          \n    return \"\" if value is None else str(value)\n\n\ndef _cut(text, limit):\n\
          \    body = _txt(text)\n    return body if len(body) <= limit else body[:limit]\n\
          \n\ndef _one_line(text, limit):\n    \"\"\"줄바꿈과 연속 공백을 한 칸으로 줄이고 limit 자에서\
          \ 자른다.\"\"\"\n    return _cut(\" \".join(_txt(text).split()), limit)\n\n\
          \ndef _local_name(iri):\n    \"\"\"IRI 의 마지막 #, /, : 뒤 이름. 없으면 원문.\"\"\"\
          \n    text = _txt(iri).strip()\n    cut = max(text.rfind(\"#\"), text.rfind(\"\
          /\"), text.rfind(\":\"))\n    tail = text[cut + 1:] if cut >= 0 else text\n\
          \    return tail or text\n\n\ndef _list_of(value):\n    \"\"\"dict 원소만 남긴\
          \ 목록. 목록이 아니면 빈 목록.\"\"\"\n    if not isinstance(value, list):\n       \
          \ return []\n    return [item for item in value if isinstance(item, dict)]\n\
          \n\ndef _term_of(statement, key):\n    \"\"\"statement 의 subject, predicate,\
          \ object term. dict 가 아니면 빈 dict.\"\"\"\n    value = statement.get(key)\
          \ if isinstance(statement, dict) else None\n    return value if isinstance(value,\
          \ dict) else {}\n\n\ndef _flag(value, default):\n    text = _txt(value).strip().lower()\n\
          \    if text in (\"true\", \"1\", \"yes\", \"y\", \"on\"):\n        return\
          \ \"true\"\n    if text in (\"false\", \"0\", \"no\", \"n\", \"off\"):\n\
          \        return \"false\"\n    return default\n\n\ndef _timeout_ms(value):\n\
          \    try:\n        number = int(float(_txt(value).strip()))\n    except\
          \ Exception:\n        number = 30000\n    return max(1000, min(110000, number))\n\
          \n\ndef _base_url(value):\n    \"\"\"끝의 / 와 /admin 을 떼어 서버 root 로 만든다.\"\
          \"\"\n    text = _txt(value).strip().rstrip(\"/\")\n    if text.lower().endswith(\"\
          /admin\"):\n        text = text[:-len(\"/admin\")].rstrip(\"/\")\n    return\
          \ text\n\n\ndef _config_error(base_url, username):\n    \"\"\"설정이 비었거나 CHANGE-ME\
          \ 자리표시자면 config_missing, 형식이 틀리면 config_invalid.\"\"\"\n    problems = []\n\
          \    lower = base_url.lower()\n    if not base_url or \"CHANGE-ME\" in base_url.upper():\n\
          \        problems.append(\"config_missing: SOR_BASE_URL\")\n    elif not\
          \ (lower.startswith(\"http://\") or lower.startswith(\"https://\")):\n \
          \       problems.append(\"config_invalid: SOR_BASE_URL 은 http:// 또는 https://\
          \ 로 시작해야 한다\")\n    user = _txt(username).strip()\n    if not user or \"\
          CHANGE-ME\" in user.upper():\n        problems.append(\"config_missing:\
          \ SOR_USERNAME\")\n    if not problems:\n        return \"\"\n    return\
          \ (\"; \".join(problems) + \". 도구 설정의 환경변수를 채운 뒤 다시 부른다. 데이터가 없는 것이 아니라\
          \ \"\n            \"설정 오류이므로 인자를 바꿔 다시 부르지 않는다\")\n\n\ndef _q(value):\n\
          \    import urllib.parse\n    return urllib.parse.quote(_txt(value), safe=\"\
          \")\n\n\ndef _build_url(base_url, path, params):\n    \"\"\"params 는 (이름,\
          \ 값) 목록이다. 값은 전부 퍼센트 인코딩한다. (url, query string 길이).\"\"\"\n    query = \"\
          &\".join(_q(key) + \"=\" + _q(value) for key, value in params)\n    return\
          \ base_url + path + (\"?\" + query if query else \"\"), len(query)\n\n\n\
          def _abs_iri(text):\n    \"\"\"절대 IRI(http, https, urn)면 (IRI, \"\"), 아니면\
          \ (\"\", 사유).\"\"\"\n    raw = _txt(text).strip()\n    if raw.startswith(\"\
          <\") and raw.endswith(\">\") and len(raw) > 2:\n        raw = raw[1:-1].strip()\n\
          \    if not raw:\n        return \"\", \"비어 있다\"\n    lower = raw.lower()\n\
          \    ok = False\n    for scheme in (\"http://\", \"https://\", \"urn:\"\
          ):\n        if lower.startswith(scheme) and len(raw) > len(scheme):\n  \
          \          ok = True\n    if not ok:\n        return \"\", \"절대 IRI(http,\
          \ https, urn)가 아니다\"\n    for ch in (\"<\", \">\", '\"', \" \", \"\\t\"\
          , \"\\n\", \"\\r\", \"{\", \"}\", \"|\", \"^\", \"`\", \"\\\\\"):\n    \
          \    if ch in raw:\n            return \"\", \"IRI 에 쓸 수 없는 문자가 있다\"\n \
          \   return raw, \"\"\n\n\ndef _stop(warning, repository, extra):\n    \"\
          \"\"호출 없이 끝낼 때의 응답.\"\"\"\n    payload = {\"status\": \"error\", \"repository\"\
          : _txt(repository), \"repository_candidates\": [],\n               \"warning\"\
          : warning}\n    payload.update(extra)\n    return payload\n\n\nWORD_CHARS\
          \ = set(\"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_:.-?$\"\
          )\nIRI_STOP_CHARS = set('<\"{}|^`\\\\ \\t\\r\\n')\n\n\ndef _iri_end(text,\
          \ start):\n    \"\"\"text[start] 가 '<' 일 때 IRI 이면 닫는 '>' 의 위치, 아니면 -1. 비교\
          \ 연산자 < 와 구분한다.\"\"\"\n    index = start + 1\n    while index < len(text):\n\
          \        ch = text[index]\n        if ch == \">\":\n            return index\n\
          \        if ch in IRI_STOP_CHARS:\n            return -1\n        index\
          \ += 1\n    return -1\n\n\ndef _string_end(text, start):\n    \"\"\"text[start]\
          \ 가 따옴표일 때 문자열 literal 다음 위치.\"\"\"\n    quote = text[start]\n    if text[start:start\
          \ + 3] == quote * 3:\n        end = text.find(quote * 3, start + 3)\n  \
          \      return len(text) if end == -1 else end + 3\n    index = start + 1\n\
          \    while index < len(text):\n        ch = text[index]\n        if ch ==\
          \ \"\\\\\":\n            index += 2\n            continue\n        if ch\
          \ == quote or ch == \"\\n\":\n            return index + 1\n        index\
          \ += 1\n    return len(text)\n\n\ndef _clean_query(text):\n    \"\"\"주석(#\
          \ 부터 줄 끝)을 지우고 연속 공백을 한 칸으로 줄인다. 문자열과 IRI 안은 그대로 둔다.\"\"\"\n    out = []\n\
          \    space = False\n    index = 0\n    size = len(text)\n    while index\
          \ < size:\n        ch = text[index]\n        if ch in \" \\t\\r\\n\":\n\
          \            space = True\n            index += 1\n            continue\n\
          \        if ch == \"#\":\n            end = text.find(\"\\n\", index)\n\
          \            index = size if end == -1 else end\n            space = True\n\
          \            continue\n        end = -1\n        if ch == \"<\":\n     \
          \       close = _iri_end(text, index)\n            if close != -1:\n   \
          \             end = close + 1\n        elif ch == '\"' or ch == \"'\":\n\
          \            end = _string_end(text, index)\n        if space and out:\n\
          \            out.append(\" \")\n        space = False\n        if end !=\
          \ -1:\n            out.append(text[index:end])\n            index = end\n\
          \        else:\n            out.append(ch)\n            index += 1\n   \
          \ return \"\".join(out).strip()\n\n\ndef _scrub(text):\n    \"\"\"문자열 literal\
          \ 과 IRI 를 같은 길이의 공백으로 지운 사본. 위치가 원문과 맞는다.\"\"\"\n    out = []\n    index\
          \ = 0\n    size = len(text)\n    while index < size:\n        ch = text[index]\n\
          \        end = -1\n        if ch == \"<\":\n            close = _iri_end(text,\
          \ index)\n            if close != -1:\n                end = close + 1\n\
          \        elif ch == '\"' or ch == \"'\":\n            end = _string_end(text,\
          \ index)\n        if end != -1:\n            out.append(\" \" * (end - index))\n\
          \            index = end\n        else:\n            out.append(ch)\n  \
          \          index += 1\n    return \"\".join(out)\n\n\ndef _tokens(text):\n\
          \    \"\"\"낱말 목록. prefix 이름(ex:insert)과 변수(?add)가 통째로 한 낱말이 되도록 : ? $ 도\
          \ 낱말 문자로 본다.\"\"\"\n    words = []\n    buf = []\n    for ch in text:\n\
          \        if ch in WORD_CHARS:\n            buf.append(ch)\n        elif\
          \ buf:\n            words.append(\"\".join(buf))\n            buf = []\n\
          \    if buf:\n        words.append(\"\".join(buf))\n    return words\n\n\
          \ndef _word_start(text, index):\n    return index == 0 or text[index - 1]\
          \ not in WORD_CHARS\n\n\ndef _apply_limit(query, scrubbed, row_limit):\n\
          \    \"\"\"중괄호 깊이 0 의 LIMIT 이 없거나 row_limit 보다 크면 row_limit + 1 로 맞춘다.\n\
          \n    하위 질의의 LIMIT(깊이 1 이상)은 건드리지 않는다. 최상위 VALUES 절이 있으면 그 앞에 넣는다.\"\"\"\
          \n    import re\n    depth = 0\n    found = None\n    values_at = -1\n \
          \   index = 0\n    size = len(scrubbed)\n    while index < size:\n     \
          \   ch = scrubbed[index]\n        if ch == \"{\":\n            depth +=\
          \ 1\n        elif ch == \"}\":\n            depth = max(0, depth - 1)\n\
          \        elif depth == 0 and _word_start(scrubbed, index):\n           \
          \ match = re.match(r\"(?i)LIMIT\\s+([0-9]+)\", scrubbed[index:])\n     \
          \       if match is not None:\n                found = (index + match.start(1),\
          \ index + match.end(1), int(match.group(1)))\n                index += match.end()\n\
          \                continue\n            if values_at == -1 and re.match(r\"\
          (?i)VALUES\\b\", scrubbed[index:]):\n                values_at = index\n\
          \        index += 1\n    target = str(row_limit + 1)\n    if found is None:\n\
          \        if values_at != -1:\n            return query[:values_at].rstrip()\
          \ + \" LIMIT \" + target + \" \" + query[values_at:]\n        return query.rstrip()\
          \ + \" LIMIT \" + target\n    if found[2] > row_limit:\n        return query[:found[0]]\
          \ + target + query[found[1]:]\n    return query\n\n\ndef main(repository_arg,\
          \ sparql, base, username, default_repo, inferred, federation, timeout_ms):\n\
          \    \"\"\"주석 제거, 공백 정리, 읽기 전용 검사, 질의 형태 판정, LIMIT 주입, Accept 결정, 요청 주소\
          \ 조립.\n\n    이 검사가 실행 안전의 유일한 장치다. LLM 이 규칙을 지키는지에 안전을 걸지 않는다.\"\"\"\n \
          \   FORBIDDEN_KEYWORDS = ['INSERT', 'DELETE', 'LOAD', 'CLEAR', 'CREATE',\
          \ 'DROP', 'COPY', 'MOVE', 'ADD', 'WITH', 'SERVICE']\n    READ_ONLY_FORMS\
          \ = ['SELECT', 'ASK', 'CONSTRUCT', 'DESCRIBE']\n    ROW_LIMIT = 200\n  \
          \  ACCEPT_RESULTS = 'application/sparql-results+json'\n    ACCEPT_TRIPLES\
          \ = 'application/n-triples'\n    QUERY_STRING_LIMIT = 6000\n    base_url\
          \ = _base_url(base)\n    repository = _txt(repository_arg).strip() or _txt(default_repo).strip()\n\
          \    out = {\"base_url\": base_url, \"repository\": repository, \"route\"\
          : \"go\", \"stop_payload\": {},\n           \"repos_url\": _build_url(base_url,\
