        targetType: if-else
      id: prep-source-gate_pre-target
      label: ''
      source: prep
      sourceHandle: source
      target: gate_pre
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: http-request
      id: gate_pre-go-login-target
      label: ''
      source: gate_pre
      sourceHandle: go
      target: login
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: code
      id: gate_pre-false-merge-target
      label: ''
      selected: false
      source: gate_pre
      sourceHandle: 'false'
      target: merge
      targetHandle: target
      type: custom
    - data:
        sourceType: http-request
        targetType: code
      id: login-source-auth-target
      label: ''
      selected: false
      source: login
      sourceHandle: source
      target: auth
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: if-else
      id: auth-source-gate_auth-target
      label: ''
      selected: false
      source: auth
      sourceHandle: source
      target: gate_auth
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: code
      id: gate_auth-false-merge-target
      label: ''
      selected: false
      source: gate_auth
      sourceHandle: 'false'
      target: merge
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: http-request
      id: gate_auth-ready-q_repos-target
      label: ''
      selected: false
      source: gate_auth
      sourceHandle: ready
      target: q_repos
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: http-request
      id: gate_auth-ready-q_exec-target
      label: ''
      selected: false
      source: gate_auth
      sourceHandle: ready
      target: q_exec
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: http-request
      id: gate_auth-no_repo-q_repos-target
      label: ''
      selected: false
      source: gate_auth
      sourceHandle: no_repo
      target: q_repos
      targetHandle: target
      type: custom
    - data:
        sourceType: http-request
        targetType: http-request
      id: q_repos-source-logout-target
      label: ''
      selected: false
      source: q_repos
      sourceHandle: source
      target: logout
      targetHandle: target
      type: custom
    - data:
        sourceType: http-request
        targetType: http-request
      id: q_exec-source-logout-target
      label: ''
      selected: false
      source: q_exec
      sourceHandle: source
      target: logout
      targetHandle: target
      type: custom
    - data:
        sourceType: http-request
        targetType: code
      id: logout-source-assemble-target
      label: ''
      selected: false
      source: logout
      sourceHandle: source
      target: assemble
      targetHandle: target
