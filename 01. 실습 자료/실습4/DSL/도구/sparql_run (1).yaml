app:
  description: 온톨로지 저장소에 읽기 전용 SPARQL 질의를 실행하고 조회 결과를 반환
  icon: ri-git-merge-line
  icon_background: '#14b8a6'
  mode: workflow
  name: sparql_run (1)
  type: agent
  use_icon_as_answer_icon: false
dependencies:
  code_agents: []
  knowledges: []
  node_configs: []
  single_agents: []
  skills: []
  workflow_apps: []
  workflow_mcp_servers: []
  workflow_tools: []
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: Knowledge Studio(SOR 6.0.0) 서버 root 주소. 관리 화면(/admin), REST API(/api/v1),
      SPARQL endpoint(/{repositoryId}/sparql)가 같은 포트에 있다. 끝에 / 와 /admin 을 붙이지 않는다(붙어
      있으면 도구가 뗀다)
    id: 2b9b4c25-7c74-f8a3-19d4-5f31413ed229
    name: SOR_BASE_URL
    selector:
    - env
    - SOR_BASE_URL
    value: http://211.109.9.74:18080
    value_type: string
  - description: 조회 전용 서비스 계정 이름. SPARQL_READ 이상 role 과 대상 repository 범위가 있어야 한다
    id: 2ca77054-8f47-0918-0bd3-a8043d23ca59
    name: SOR_USERNAME
    selector:
    - env
    - SOR_USERNAME
    value: ontology_edu
    value_type: string
  - description: 조회 전용 서비스 계정 비밀번호. secret 이라 export 시 비워진다
    id: 62a2917e-638c-ba07-7d5c-19de49f0d1bd
    name: SOR_PASSWORD
    selector:
    - env
    - SOR_PASSWORD
    value: ''
    value_type: secret
  - description: repository 인자를 비웠을 때 쓰는 기본 repository ID. 비워 두면 repository 인자가 사실상
      필수가 된다
    id: fc9938ae-f202-2132-3a9f-c926780e7a13
    name: SOR_REPOSITORY
    selector:
    - env
    - SOR_REPOSITORY
    value: manufacturing_erp_ontology
    value_type: string
  - description: 추론 결과 포함 여부(true 또는 false). SPARQL, overview, resource 조회의 includeInferred
      로 보낸다
    id: 64b8c65a-7642-7360-2d06-70c7590729ec
    name: SOR_INCLUDE_INFERRED
    selector:
    - env
    - SOR_INCLUDE_INFERRED
    value: 'true'
    value_type: string
  - description: RDB Federation 매핑 포함 여부(true 또는 false). includeFederation 으로 보낸다
    id: b3d7ed78-a958-587e-1d80-32c8938a5eb5
    name: SOR_INCLUDE_FEDERATION
    selector:
    - env
    - SOR_INCLUDE_FEDERATION
    value: 'false'
    value_type: string
  - description: SPARQL 질의 timeout(ms). 1,000 미만은 1,000, 110,000 초과는 110,000 으로 맞춘다.
      이름 검색의 포함 검색과 IRI 검색은 10,000 을 넘지 않는다
    id: 8e69e122-af8f-f0aa-c1c5-2fedaae6fae1
    name: SOR_TIMEOUT_MS
    selector:
    - env
    - SOR_TIMEOUT_MS
    value: 30000
    value_type: integer
  features:
    file_upload:
      image:
        detail: high
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: code
      id: start-source-prep-target
      label: ''
      source: start
      sourceHandle: source
      target: prep
      targetHandle: target
      type: custom
    - data:
