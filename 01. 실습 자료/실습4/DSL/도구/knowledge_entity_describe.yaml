    nodes:
    - computedPosition:
        x: 80
        y: 140
        z: 0
      data:
        desc: repository ID(비우면 기본값)와 절대 IRI 한 개를 받는다
        display_variables:
        - repository
        - iri
        retry_config:
          max_retries: 3
          retry_enabled: false
          retry_interval: 300
        title: 시작
        type: start
        variables:
        - default: ''
          description: '조회할 Knowledge Studio repository 의 ID 다. kg_list_repositories
            결과에서 can_query 가 true 인 repositories[].id 를 한 글자도 바꾸지 않고 넣는다. 도구 설정에 기본
            repository 가 있으면 빈 문자열 "" 로 둔다(null 금지). 예시 1: manufacturing-kg. 예시 2:
            demo. 사용자가 말한 단서를 그대로 쓰고 값을 지어내지 않는다.'
          label: repository ID
          required: false
          type: text-input
          variable: repository
        - default: ''
          description: '볼 대상의 절대 IRI(http, https, urn)다. kg_search_entities, kg_describe_schema,
            sparql_run 결과의 IRI 를 한 글자도 바꾸지 않고 넣는다. prefix 표기(ex:Pump)는 kg_describe_schema
            의 prefixes 로 펼쳐 넣는다. 예시 1: https://example.org/onto#Pump. 예시 2: https://example.org/data/P-101.
            사용자가 말한 단서를 그대로 쓰고 값을 지어내지 않는다.'
          label: 대상 IRI
          required: true
          type: text-input
          variable: iri
