          \n    return \"\" if value is None else str(value)\n\n\ndef _cut(text, limit):\n\
          \    body = _txt(text)\n    return body if len(body) <= limit else body[:limit]\n\
          \n\ndef _one_line(text, limit):\n    \"\"\"줄바꿈과 연속 공백을 한 칸으로 줄이고 limit 자에서\
          \ 자른다.\"\"\"\n    return _cut(\" \".join(_txt(text).split()), limit)\n\n\
          \ndef _local_name(iri):\n    \"\"\"IRI 의 마지막 #, /, : 뒤 이름. 없으면 원문.\"\"\"\
          \n    text = _txt(iri).strip()\n    cut = max(text.rfind(\"#\"), text.rfind(\"\
          /\"), text.rfind(\":\"))\n    tail = text[cut + 1:] if cut >= 0 else text\n\
          \    return tail or text\n\n\ndef _list_of(value):\n    \"\"\"dict 원소만 남긴\
          \ 목록. 목록이 아니면 빈 목록.\"\"\"\n    if not isinstance(value, list):\n       \
          \ return []\n    return [item for item in value if isinstance(item, dict)]\n\
          \n\ndef _term_of(statement, key):\n    \"\"\"statement 의 subject, predicate,\
          \ object term. dict 가 아니면 빈 dict.\"\"\"\n    value = statement.get(key)\
          \ if isinstance(statement, dict) else None\n    return value if isinstance(value,\
          \ dict) else {}\n\n\n# default-value 를 건 노드가 실패하면 원인과 무관하게 status 0 과 빈\
          \ body 가 온다. 그래서 warning 은 원인을\n# 단정하지 않고 실패 사실만 적는다(login_failed, <대상>_request_failed).\n\
          FAILED_REQUEST_REASON = (\"요청이 실패했다. 서버 접속 실패, 권한 거절, timeout, 4xx, 5xx\
          \ 는 실패 시 기본값(status 0)으로 \"\n                         \"바뀌어 이 도구가 구분하지 못하며,\
          \ 구분은 워크플로 실행 기록의 오류 원문으로 한다\")\nADMIN_HINT = \". 다시 부르지 말고 관리자에게 계정 설정과\
          \ 서버 상태 확인이 필요하다고 답한다\"\n\n\ndef _status(status_code):\n    try:\n     \
          \   return int(float(_txt(status_code).strip() or \"0\"))\n    except Exception:\n\
          \        return 0\n\n\ndef _header(headers, name):\n    \"\"\"응답 header\
          \ 를 대소문자 구분 없이 찾는다. 없으면 빈 문자열.\"\"\"\n    if not isinstance(headers, dict):\n\
          \        return \"\"\n    want = name.lower()\n    for key, value in headers.items():\n\
          \        if _txt(key).strip().lower() == want:\n            return _txt(value).strip()\n\
          \    return \"\"\n\n\ndef _server_message(body, limit, headers=None):\n\
          \    \"\"\"서버 오류 본문 {timestamp, status, error, message, code, correlationId}\
          \ 에서 message 와\n    correlationId 를 꺼낸다. JSON 이 아니면 본문 원문을 한 줄로 줄여 쓴다.\"\
          \"\"\n    import json\n    raw = _txt(body)\n    data = None\n    if raw.strip().startswith(\"\
          {\"):\n        try:\n            data = json.loads(raw)\n        except\
          \ Exception:\n            data = None\n    message = \"\"\n    correlation\
          \ = \"\"\n    if isinstance(data, dict):\n        message = _txt(data.get(\"\
          message\")).strip() or _txt(data.get(\"error\")).strip()\n        correlation\
          \ = _txt(data.get(\"correlationId\")).strip()\n    if not message:\n   \
          \     message = raw\n    text = _one_line(message, limit)\n    if not correlation:\n\
          \        correlation = _header(headers, \"x-correlation-id\")\n    if correlation:\n\
          \        text = text + \" (correlationId \" + correlation + \")\"\n    return\
          \ text\n\n\ndef _json_body(status_code, body):\n    \"\"\"조회 노드의 응답을 JSON\
          \ 객체로 읽는다. (객체 또는 None, 실패 사유).\"\"\"\n    import json\n    code = _status(status_code)\n\
          \    if code == 0:\n        return None, FAILED_REQUEST_REASON\n    if code\
          \ != 200:\n        return None, \"http_\" + str(code) + \": \" + _server_message(body,\
          \ 200)\n    try:\n        data = json.loads(_txt(body))\n    except Exception:\n\
          \        return None, \"응답이 JSON 이 아니다\"\n    if not isinstance(data, dict):\n\
          \        return None, \"응답 형식이 예상과 다르다\"\n    return data, \"\"\n\n\ndef\
          \ main(status_code, body, repository):\n    \"\"\"로그인 응답에서 token 을 꺼내고 다음\
          \ 갈래(ready, no_repo, fail)를 정한다.\"\"\"\n    import json\n    NEEDS_REPOSITORY\
          \ = True\n    code = _status(status_code)\n    repo = _txt(repository).strip()\n\
          \n    def fail(warning):\n        return {\"token\": \"\", \"route\": \"\
          fail\",\n                \"fail_payload\": {\"status\": \"error\", \"repository\"\
          : repo, \"repository_candidates\": [],\n                               \
          \  \"warning\": warning}}\n\n    if code == 0:\n        # default-value\
          \ 때문에 401, 403 과 접속 실패가 모두 status 0 이다. 원인을 단정하지 않는다.\n        return fail(\"\
          login_failed: 로그인 요청이 실패했다. 서버 접속 실패 또는 계정 인증 실패이며, 구분은 \"\n           \
          \         \"워크플로 실행 기록의 오류 원문으로 한다\" + ADMIN_HINT)\n    if code != 200:\n\
          \        # login 노드의 오류 전략을 빼면 이 갈래로 온다. 받은 status 와 서버 message 를 그대로 싣는다.\n\
          \        return fail(\"login_failed: 로그인 요청이 http_\" + str(code) + \" 로\
          \ 끝났다(\"\n                    + _server_message(body, 200) + \")\" + ADMIN_HINT)\n\
          \    data = None\n    try:\n        data = json.loads(_txt(body))\n    except\
          \ Exception:\n        data = None\n    token = _txt(data.get(\"token\")).strip()\
          \ if isinstance(data, dict) else \"\"\n    if not token:\n        return\
          \ fail(\"login_failed: 로그인 응답에 token 이 없다\" + ADMIN_HINT)\n    if NEEDS_REPOSITORY\
          \ and not repo:\n        return {\"token\": token, \"route\": \"no_repo\"\
          , \"fail_payload\": {}}\n    return {\"token\": token, \"route\": \"ready\"\
          , \"fail_payload\": {}}\n"
