            data:
              type: code
              title: 응답 정리
              desc: 두 목록을 id 로 합치고 can_query 가 true 인 항목을 앞에 둔다
              code_language: python3
              code: "\ndef _txt(value):\n    \"\"\"None 과 숫자를 포함해 무엇이 오든 문자열로 만든다.\"\
                \"\"\n    return \"\" if value is None else str(value)\n\n\ndef _cut(text,\
                \ limit):\n    body = _txt(text)\n    return body if len(body) <=\
                \ limit else body[:limit]\n\n\ndef _one_line(text, limit):\n    \"\
                \"\"줄바꿈과 연속 공백을 한 칸으로 줄이고 limit 자에서 자른다.\"\"\"\n    return _cut(\"\
                \ \".join(_txt(text).split()), limit)\n\n\ndef _local_name(iri):\n\
                \    \"\"\"IRI 의 마지막 #, /, : 뒤 이름. 없으면 원문.\"\"\"\n    text = _txt(iri).strip()\n\
                \    cut = max(text.rfind(\"#\"), text.rfind(\"/\"), text.rfind(\"\
                :\"))\n    tail = text[cut + 1:] if cut >= 0 else text\n    return\
                \ tail or text\n\n\ndef _list_of(value):\n    \"\"\"dict 원소만 남긴 목록.\
                \ 목록이 아니면 빈 목록.\"\"\"\n    if not isinstance(value, list):\n     \
                \   return []\n    return [item for item in value if isinstance(item,\
                \ dict)]\n\n\ndef _term_of(statement, key):\n    \"\"\"statement 의\
                \ subject, predicate, object term. dict 가 아니면 빈 dict.\"\"\"\n    value\
                \ = statement.get(key) if isinstance(statement, dict) else None\n\
                \    return value if isinstance(value, dict) else {}\n\n\n# default-value\
                \ 를 건 노드가 실패하면 원인과 무관하게 status 0 과 빈 body 가 온다. 그래서 warning 은 원인을\n\
                # 단정하지 않고 실패 사실만 적는다(login_failed, <대상>_request_failed).\nFAILED_REQUEST_REASON\
                \ = (\"요청이 실패했다. 서버 접속 실패, 권한 거절, timeout, 4xx, 5xx 는 실패 시 기본값(status\
                \ 0)으로 \"\n                         \"바뀌어 이 도구가 구분하지 못하며, 구분은 워크플로\
                \ 실행 기록의 오류 원문으로 한다\")\nADMIN_HINT = \". 다시 부르지 말고 관리자에게 계정 설정과 서버\
                \ 상태 확인이 필요하다고 답한다\"\n\n\ndef _status(status_code):\n    try:\n  \
                \      return int(float(_txt(status_code).strip() or \"0\"))\n   \
                \ except Exception:\n        return 0\n\n\ndef _header(headers, name):\n\
                \    \"\"\"응답 header 를 대소문자 구분 없이 찾는다. 없으면 빈 문자열.\"\"\"\n    if not\
                \ isinstance(headers, dict):\n        return \"\"\n    want = name.lower()\n\
                \    for key, value in headers.items():\n        if _txt(key).strip().lower()\
                \ == want:\n            return _txt(value).strip()\n    return \"\"\
                \n\n\ndef _server_message(body, limit, headers=None):\n    \"\"\"\
                서버 오류 본문 {timestamp, status, error, message, code, correlationId}\
                \ 에서 message 와\n    correlationId 를 꺼낸다. JSON 이 아니면 본문 원문을 한 줄로 줄여\
                \ 쓴다.\"\"\"\n    import json\n    raw = _txt(body)\n    data = None\n\
                \    if raw.strip().startswith(\"{\"):\n        try:\n           \
                \ data = json.loads(raw)\n        except Exception:\n            data\
                \ = None\n    message = \"\"\n    correlation = \"\"\n    if isinstance(data,\
                \ dict):\n        message = _txt(data.get(\"message\")).strip() or\
                \ _txt(data.get(\"error\")).strip()\n        correlation = _txt(data.get(\"\
                correlationId\")).strip()\n    if not message:\n        message =\
                \ raw\n    text = _one_line(message, limit)\n    if not correlation:\n\
                \        correlation = _header(headers, \"x-correlation-id\")\n  \
                \  if correlation:\n        text = text + \" (correlationId \" + correlation\
                \ + \")\"\n    return text\n\n\ndef _json_body(status_code, body):\n\
                \    \"\"\"조회 노드의 응답을 JSON 객체로 읽는다. (객체 또는 None, 실패 사유).\"\"\"\n \
                \   import json\n    code = _status(status_code)\n    if code == 0:\n\
                \        return None, FAILED_REQUEST_REASON\n    if code != 200:\n\
                \        return None, \"http_\" + str(code) + \": \" + _server_message(body,\
                \ 200)\n    try:\n        data = json.loads(_txt(body))\n    except\
                \ Exception:\n        return None, \"응답이 JSON 이 아니다\"\n    if not\
                \ isinstance(data, dict):\n        return None, \"응답 형식이 예상과 다르다\"\
                \n    return data, \"\"\n\n\ndef main(repos_body, repos_code, onto_body,\
                \ onto_code, default_repository):\n    \"\"\"조회 권한 목록과 온톨로지 저장소 목록을\
                \ id 로 합친다. 조회 가능한 repository 가 앞에 온다.\"\"\"\n    default_repo = _txt(default_repository).strip()\n\
                \    warnings = []\n    sparql_data, sparql_reason = _json_body(repos_code,\
                \ repos_body)\n    onto_data, onto_reason = _json_body(onto_code,\
                \ onto_body)\n    if sparql_data is None and onto_data is None:\n\
                \        return {\"payload\": {\"status\": \"error\", \"repositories\"\
                : [], \"count\": 0,\n                            \"default_repository\"\
                : default_repo,\n                            \"warning\": (\"repository_list_request_failed:\
                \ 조회 권한 목록 요청이 실패했다(\"\n                                        +\
                \ sparql_reason + \"); ontology_repository_list_request_failed: 온톨로지\
                \ \"\n                                        \"저장소 목록 요청이 실패했다(\"\
                \ + onto_reason + \")\" + ADMIN_HINT)}}\n    items = {}\n    order\
                \ = []\n\n    def slot(rid):\n        if rid not in items:\n     \
                \       items[rid] = {\"id\": rid, \"label\": \"\", \"can_query\"\
                : False, \"state\": \"\", \"base_url\": \"\"}\n            order.append(rid)\n\
                \        return items[rid]\n\n    if sparql_data is not None:\n  \
                \      for entry in _list_of(sparql_data.get(\"repositories\")):\n\
                \            rid = _txt(entry.get(\"id\")).strip()\n            if\
                \ not rid:\n                continue\n            item = slot(rid)\n\
                \            if not item[\"label\"]:\n                item[\"label\"\
                ] = _txt(entry.get(\"label\")).strip()\n            if entry.get(\"\
                canQuery\") is True:\n                item[\"can_query\"] = True\n\
                \    else:\n        warnings.append(\"repository_list_request_failed:\
                \ 조회 권한 목록 요청이 실패해 can_query 를 판정하지 \"\n                        \"\
                못했다(\" + sparql_reason + \")\" + ADMIN_HINT)\n    if onto_data is\
                \ not None:\n        for entry in _list_of(onto_data.get(\"repositories\"\
                )):\n            rid = _txt(entry.get(\"id\")).strip()\n         \
                \   if not rid:\n                continue\n            item = slot(rid)\n\
                \            if not item[\"label\"]:\n                item[\"label\"\
                ] = _txt(entry.get(\"label\")).strip()\n            item[\"state\"\
                ] = _txt(entry.get(\"state\")).strip()\n            item[\"base_url\"\
                ] = _txt(entry.get(\"baseUrl\")).strip()\n    else:\n        warnings.append(\"\
                ontology_repository_list_request_failed: 온톨로지 저장소 목록 요청이 실패해 state\
                \ 와 \"\n                        \"base_url 이 비었다(\" + onto_reason\
                \ + \")\")\n    repositories = [items[rid] for rid in order]\n   \
                \ repositories.sort(key=lambda item: (0 if item[\"can_query\"] else\
                \ 1, item[\"id\"]))\n    queryable = [item[\"id\"] for item in repositories\
                \ if item[\"can_query\"]]\n    if sparql_data is None:\n        status\
                \ = \"error\"\n    elif queryable:\n        status = \"success\"\n\
                \        if default_repo and default_repo not in queryable:\n    \
                \        warnings.append(\"default_repository_unlisted: 도구 설정의 기본\
                \ repository \" + default_repo\n                            + \" 는\
                \ 조회 가능한 목록에 없다. repository 인자를 비우지 말고 목록의 id 를 넣는다\")\n    else:\n\
                \        status = \"no_results\"\n        warnings.append(\"no_queryable_repository:\
                \ 이 계정이 조회할 수 있는 repository 가 없다. 관리자에게 조회 \"\n                  \
                \      \"권한(SPARQL 조회)과 저장소 범위 확인이 필요하다고 답한다\")\n    return {\"payload\"\
                : {\"status\": status, \"repositories\": repositories,\n         \
                \               \"default_repository\": default_repo, \"count\": len(repositories),\n\
                \                        \"warning\": \"; \".join(warnings)}}\n"
              variables:
              - variable: repos_body
                value_selector:
                - q_repos
                - body
              - variable: repos_code
                value_selector:
                - q_repos
                - status_code
              - variable: onto_body
                value_selector:
                - q_onto_repos
                - body
              - variable: onto_code
                value_selector:
                - q_onto_repos
                - status_code
              - variable: default_repository
