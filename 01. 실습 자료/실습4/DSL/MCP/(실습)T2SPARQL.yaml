                type\"))\n    value = _txt(cell.get(\"value\"))\n    if kind == \"\
                bnode\":\n        return \"_:\" + value\n    if kind in (\"literal\"\
                , \"typed-literal\"):\n        lang = _txt(cell.get(\"xml:lang\"))\n\
                \        if lang:\n            return value + \"@\" + lang\n     \
                \   datatype = _txt(cell.get(\"datatype\"))\n        if datatype and\
                \ datatype not in PLAIN_DATATYPES:\n            if datatype.startswith(XSD_NS):\n\
                \                return value + \"^^xsd:\" + datatype[len(XSD_NS):]\n\
                \            return value + \"^^<\" + datatype + \">\"\n    return\
                \ value\n\n\ndef _sparql_rows(status_code, body):\n    \"\"\"default-value\
                \ 조회 노드의 SELECT 결과를 (binding 목록 또는 None, 실패 사유) 로 읽는다.\"\"\"\n   \
                \ code = _status(status_code)\n    if code == 0:\n        return None,\
                \ FAILED_REQUEST_REASON\n    if code != 200:\n        return None,\
                \ \"http_\" + str(code) + \": \" + _server_message(body, 200)\n  \
                \  doc = _sparql_doc(body)\n    if doc is None:\n        return None,\
                \ \"응답을 SPARQL 결과로 읽지 못했다\"\n    results = doc.get(\"results\")\n\
                \    if not isinstance(results, dict) or not isinstance(results.get(\"\
                bindings\"), list):\n        return [], \"\"\n    return [b for b\
                \ in results[\"bindings\"] if isinstance(b, dict)], \"\"\n\n\ndef\
                \ _nt_unescape(text):\n    \"\"\"N-Triples 문자열의 escape(역슬래시 뒤 t, b,\
                \ n, r, f, 따옴표, 역슬래시, u 4자리, U 8자리)를 푼다.\"\"\"\n    simple = {\"t\"\
                : \"\\t\", \"b\": \"\\b\", \"n\": \"\\n\", \"r\": \"\\r\", \"f\":\
                \ \"\\f\", '\"': '\"', \"'\": \"'\", \"\\\\\": \"\\\\\"}\n    out\
                \ = []\n    index = 0\n    size = len(text)\n    while index < size:\n\
                \        ch = text[index]\n        if ch == \"\\\\\" and index + 1\
                \ < size:\n            nxt = text[index + 1]\n            if nxt ==\
                \ \"u\" and index + 6 <= size:\n                try:\n           \
                \         out.append(chr(int(text[index + 2:index + 6], 16)))\n  \
                \                  index += 6\n                    continue\n    \
                \            except Exception:\n                    pass\n       \
                \     if nxt == \"U\" and index + 10 <= size:\n                try:\n\
                \                    out.append(chr(int(text[index + 2:index + 10],\
                \ 16)))\n                    index += 10\n                    continue\n\
                \                except Exception:\n                    pass\n   \
                \         if nxt in simple:\n                out.append(simple[nxt])\n\
                \                index += 2\n                continue\n        out.append(ch)\n\
                \        index += 1\n    return \"\".join(out)\n\n\ndef _nt_term(text):\n\
                \    \"\"\"N-Triples 항 하나를 SPARQL JSON 결과와 같은 dict 로 읽는다. 못 읽으면 None.\"\
                \"\"\n    body = text.strip()\n    if body.startswith(\"<\") and body.endswith(\"\
                >\"):\n        return {\"type\": \"uri\", \"value\": body[1:-1]}\n\
                \    if body.startswith(\"_:\"):\n        return {\"type\": \"bnode\"\
                , \"value\": body[2:]}\n    if body.startswith('\"'):\n        index\
                \ = 1\n        while index < len(body):\n            if body[index]\
                \ == \"\\\\\":\n                index += 2\n                continue\n\
                \            if body[index] == '\"':\n                break\n    \
                \        index += 1\n        cell = {\"type\": \"literal\", \"value\"\
                : _nt_unescape(body[1:index])}\n        rest = body[index + 1:]\n\
                \        if rest.startswith(\"@\"):\n            cell[\"xml:lang\"\
                ] = rest[1:]\n        elif rest.startswith(\"^^<\") and rest.endswith(\"\
                >\"):\n            cell[\"datatype\"] = rest[3:-1]\n        return\
                \ cell\n    return None\n\n\ndef _nt_line(line):\n    \"\"\"N-Triples\
                \ 한 줄을 {s, p, o} 로 읽는다. 빈 줄과 주석은 \"\", 읽지 못한 줄은 None.\"\"\"\n    import\
                \ re\n    text = line.strip()\n    if not text or text.startswith(\"\
                #\"):\n        return \"\"\n    match = re.match(r\"^(<[^>]*>|_:\\\
                S+)\\s+(<[^>]*>)\\s+(.+?)\\s*\\.\\s*$\", text)\n    if match is None:\n\
                \        return None\n    subject = _nt_term(match.group(1))\n   \
                \ predicate = _nt_term(match.group(2))\n    obj = _nt_term(match.group(3))\n\
                \    if subject is None or predicate is None or obj is None:\n   \
                \     return None\n    return {\"s\": _cell(subject), \"p\": _txt(predicate.get(\"\
                value\")), \"o\": _cell(obj)}\n\n\ndef _fit_budget(items, budget):\n\
                \    \"\"\"직렬화 길이가 budget 을 넘으면 뒤에서부터 덜어 낸다. (남긴 목록, 덜어 낸 수).\"\"\"\
                \n    import json\n    kept = list(items)\n    while kept:\n     \
                \   try:\n            size = len(json.dumps(kept, ensure_ascii=False))\n\
                \        except Exception:\n            size = 0\n        if size\
                \ <= budget:\n            break\n        kept.pop()\n    return kept,\
                \ len(items) - len(kept)\n\n\ndef main(body, status_code, headers,\
                \ repos_body, repos_code, repository, query_form, executed_query):\n\
                \    \"\"\"실행 결과를 표(SELECT), 참거짓(ASK), triple(CONSTRUCT, DESCRIBE)로\
                \ 정리한다.\"\"\"\n    ROW_LIMIT = 200\n    CHAR_BUDGET = 12000\n    TRIPLE_LIMIT\
                \ = 200\n    ERROR_CHARS = 500\n    repo = _txt(repository).strip()\n\
                \    form = _txt(query_form).upper()\n    base = {\"query_form\":\
                \ form, \"executed_query\": _txt(executed_query), \"columns\": [],\
                \ \"rows\": [],\n            \"row_count\": 0, \"boolean\": False,\
                \ \"triples\": [], \"truncated\": False, \"server_result_limit\":\
                \ 0}\n    stop, _queryable, check_warning = _repo_gate(repo, repos_code,\
                \ repos_body)\n    if stop is not None:\n        stop.update(base)\n\
                \        return {\"payload\": stop}\n    warnings = [check_warning]\
                \ if check_warning else []\n    limit_text = _header(headers, \"x-sor-result-limit\"\
                )\n    try:\n        server_limit = int(limit_text) if limit_text\
                \ else 0\n    except Exception:\n        server_limit = 0\n    base[\"\
                server_result_limit\"] = server_limit\n\n    def payload_of(status,\
                \ extra, notes):\n        payload = {\"status\": status, \"repository\"\
                : repo, \"repository_candidates\": []}\n        payload.update(base)\n\
                \        payload.update(extra)\n        payload[\"warning\"] = \"\
                ; \".join(w for w in (warnings + notes) if w)\n        return {\"\
                payload\": payload}\n\n    def limit_note(count):\n        if server_limit\
                \ and count >= server_limit:\n            return [\"server_result_limit_reached:\
                \ 서버 결과 상한 \" + str(server_limit) + \"행에 도달했다. 결과가 \"\n          \
                \          \"더 있을 수 있다\"]\n        return []\n\n    no_rows = (\"\
                no_results: 질의는 유효했으나 결과가 0건이다. 데이터 없음으로 단정하지 말고 IRI 와 경로를 \"\n  \
                \             \"kg_describe_schema, kg_search_entities 로 다시 확인한다\"\
                )\n    code = _status(status_code)\n    if code == 401:\n        return\
                \ payload_of(\"error\", {}, [\"auth_failed: 질의가 인증 오류(401)로 거절되었다:\
                \ \"\n                                        + _server_message(body,\
                \ ERROR_CHARS, headers) + ADMIN_HINT])\n    if code != 200:\n    \
                \    message = _server_message(body, ERROR_CHARS, headers)\n     \
                \   hint = \"\"\n        if \"timeout\" in message.lower() or \"timed\
                \ out\" in message.lower():\n            hint = \". timeout 이면 조건을\
                \ 좁혀 한 번 더 부른다\"\n        return payload_of(\"error\", {}, [\"sparql_error:\
                \ http_\" + str(code) + \" \" + message + hint])\n    raw = _txt(body)\n\
                \    if form in (\"CONSTRUCT\", \"DESCRIBE\"):\n        triples =\
                \ []\n        total = 0\n        unread = 0\n        for line in raw.splitlines():\n\
                \            parsed = _nt_line(line)\n            if parsed == \"\"\
                :\n                continue\n            if parsed is None:\n    \
                \            unread += 1\n                continue\n            total\
                \ += 1\n            if len(triples) < TRIPLE_LIMIT:\n            \
                \    triples.append(parsed)\n        if total == 0 and unread:\n \
                \           return payload_of(\"error\", {}, [\"invalid_response:\
                \ 응답을 N-Triples 로 읽지 못했다: \"\n                                   \
                \         + _one_line(raw, ERROR_CHARS)])\n        notes = []\n  \
                \      if unread:\n            notes.append(\"unread_lines: N-Triples\
                \ 로 읽지 못한 \" + str(unread) + \"줄을 뺐다\")\n        truncated = total\
                \ > len(triples)\n        if truncated:\n            notes.append(\"\
                truncated: triple 이 상한 \" + str(TRIPLE_LIMIT) + \"건을 넘어 잘렸다(전체 \"\
                \ + str(total)\n                         + \"건). 합계와 순위는 이 결과로 단정하지\
                \ 않는다\")\n        triples, dropped = _fit_budget(triples, CHAR_BUDGET)\n\
                \        if dropped:\n            truncated = True\n            notes.append(\"\
                truncated: 응답 글자 상한에서 triple \" + str(dropped) + \"건을 덜어 냈다\")\n \
                \       notes += limit_note(total)\n        if not triples:\n    \
                \        return payload_of(\"no_results\", {\"truncated\": truncated},\
                \ notes + [no_rows])\n        return payload_of(\"success\", {\"triples\"\
                : triples, \"truncated\": truncated}, notes)\n    doc = _sparql_doc(raw)\n\
                \    if doc is None:\n        return payload_of(\"error\", {}, [\"\
                invalid_response: 응답을 SPARQL 결과로 읽지 못했다: \"\n                    \
                \                    + _one_line(raw, ERROR_CHARS)])\n    if form\
                \ == \"ASK\" or \"boolean\" in doc:\n        return payload_of(\"\
                success\", {\"boolean\": doc.get(\"boolean\") is True}, [])\n    columns\
                \ = []\n    head = doc.get(\"head\")\n    if isinstance(head, dict)\
                \ and isinstance(head.get(\"vars\"), list):\n        columns = [_txt(v)\
                \ for v in head[\"vars\"]]\n    bindings = []\n    results = doc.get(\"\
                results\")\n    if isinstance(results, dict) and isinstance(results.get(\"\
                bindings\"), list):\n        bindings = [b for b in results[\"bindings\"\
                ] if isinstance(b, dict)]\n    if not columns:\n        for binding\
                \ in bindings:\n            for key in binding.keys():\n         \
                \       if _txt(key) not in columns:\n                    columns.append(_txt(key))\n\
                \    rows = []\n    for binding in bindings[:ROW_LIMIT]:\n       \
                \ row = {}\n        for name in columns:\n            row[name] =\
                \ _cell(binding.get(name))\n        rows.append(row)\n    notes =\
                \ []\n    truncated = len(bindings) > ROW_LIMIT\n    if truncated:\n\
                \        notes.append(\"truncated: 행이 상한 \" + str(ROW_LIMIT) + \"\
                건에서 잘렸다. 합계와 순위는 이 결과로 단정하지 \"\n                     \"말고 COUNT 나\
                \ 집계 질의로 다시 조회한다\")\n    rows, dropped = _fit_budget(rows, CHAR_BUDGET)\n\
                \    if dropped:\n        truncated = True\n        notes.append(\"\
                truncated: 응답 글자 상한에서 행 \" + str(dropped) + \"건을 덜어 냈다\")\n    notes\
                \ += limit_note(len(bindings))\n    if not rows:\n        return payload_of(\"\
                no_results\", {\"columns\": columns, \"truncated\": truncated}, notes\
                \ + [no_rows])\n    return payload_of(\"success\", {\"columns\": columns,\
                \ \"rows\": rows, \"row_count\": len(rows),\n                    \
                \              \"truncated\": truncated}, notes)\n"
              variables:
              - variable: body
