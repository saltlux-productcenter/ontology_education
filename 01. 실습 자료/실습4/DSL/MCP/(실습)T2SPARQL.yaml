                \ \"<sparql\" not in raw:\n        return None\n    variables = [_xml_unescape(v)\
                \ for v in re.findall(r\"<variable\\s+name=\\\"([^\\\"]*)\\\"\", raw)]\n\
                \    ask = re.search(r\"<boolean>\\s*(true|false)\\s*</boolean>\"\
