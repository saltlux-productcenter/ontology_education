            data:
              type: code
              title: 응답 정리
              desc: repository 를 대조한 뒤 exact, contains, iri 순으로 후보를 합쳐 20건까지 담는다
              code_language: python3
              code: "\ndef _txt(value):\n    \"\"\"None 과 숫자를 포함해 무엇이 오든 문자열로 만든다.\"\
                \"\"\n    return \"\" if value is None else str(value)\n\n\ndef _cut(text,\
                \ limit):\n    body = _txt(text)\n    return body if len(body) <=\
                \ limit else body[:limit]\n\n\ndef _one_line(text, limit):\n    \"\
                \"\"줄바꿈과 연속 공백을 한 칸으로 줄이고 limit 자에서 자른다.\"\"\"\n    return _cut(\"\
                \ \".join(_txt(text).split()), limit)\n\n\ndef _local_name(iri):\n\
                \    \"\"\"IRI 의 마지막 #, /, : 뒤 이름. 없으면 원문.\"\"\"\n    text = _txt(iri).strip()\n\
                \    cut = max(text.rfind(\"#\"), text.rfind(\"/\"), text.rfind(\"\
                :\"))\n    tail = text[cut + 1:] if cut >= 0 else text\n    return\
                \ tail or text\n\n\ndef _list_of(value):\n    \"\"\"dict 원소만 남긴 목록.\
                \ 목록이 아니면 빈 목록.\"\"\"\n    if not isinstance(value, list):\n     \
                \   return []\n    return [item for item in value if isinstance(item,\
                \ dict)]\n\n\ndef _term_of(statement, key):\n    \"\"\"statement 의\
                \ subject, predicate, object term. dict 가 아니면 빈 dict.\"\"\"\n    value\
                \ = statement.get(key) if isinstance(statement, dict) else None\n\
                \    return value if isinstance(value, dict) else {}\n\n\n# default-value\
                \ 를 건 노드가 실패하면 원인과 무관하게 status 0 과 빈 body 가 온다. 그래서 warning 은 원인을\n\
                # 단정하지 않고 실패 사실만 적는다(login_failed, <대상>_request_failed).\nFAILED_REQUEST_REASON\
                \ = (\"요청이 실패했다. 서버 접속 실패, 권한 거절, timeout, 4xx, 5xx 는 실패 시 기본값(status\
                \ 0)으로 \"\n                         \"바뀌어 이 도구가 구분하지 못하며, 구분은 워크플로\
                \ 실행 기록의 오류 원문으로 한다\")\nADMIN_HINT = \". 다시 부르지 말고 관리자에게 계정 설정과 서버\
                \ 상태 확인이 필요하다고 답한다\"\n\n\ndef _status(status_code):\n    try:\n  \
                \      return int(float(_txt(status_code).strip() or \"0\"))\n   \
                \ except Exception:\n        return 0\n\n\ndef _header(headers, name):\n\
                \    \"\"\"응답 header 를 대소문자 구분 없이 찾는다. 없으면 빈 문자열.\"\"\"\n    if not\
                \ isinstance(headers, dict):\n        return \"\"\n    want = name.lower()\n\
                \    for key, value in headers.items():\n        if _txt(key).strip().lower()\
                \ == want:\n            return _txt(value).strip()\n    return \"\"\
                \n\n\ndef _server_message(body, limit, headers=None):\n    \"\"\"\
                서버 오류 본문 {timestamp, status, error, message, code, correlationId}\
                \ 에서 message 와\n    correlationId 를 꺼낸다. JSON 이 아니면 본문 원문을 한 줄로 줄여\
                \ 쓴다.\"\"\"\n    import json\n    raw = _txt(body)\n    data = None\n\
                \    if raw.strip().startswith(\"{\"):\n        try:\n           \
                \ data = json.loads(raw)\n        except Exception:\n            data\
                \ = None\n    message = \"\"\n    correlation = \"\"\n    if isinstance(data,\
                \ dict):\n        message = _txt(data.get(\"message\")).strip() or\
                \ _txt(data.get(\"error\")).strip()\n        correlation = _txt(data.get(\"\
                correlationId\")).strip()\n    if not message:\n        message =\
                \ raw\n    text = _one_line(message, limit)\n    if not correlation:\n\
                \        correlation = _header(headers, \"x-correlation-id\")\n  \
                \  if correlation:\n        text = text + \" (correlationId \" + correlation\
                \ + \")\"\n    return text\n\n\ndef _json_body(status_code, body):\n\
                \    \"\"\"조회 노드의 응답을 JSON 객체로 읽는다. (객체 또는 None, 실패 사유).\"\"\"\n \
                \   import json\n    code = _status(status_code)\n    if code == 0:\n\
                \        return None, FAILED_REQUEST_REASON\n    if code != 200:\n\
                \        return None, \"http_\" + str(code) + \": \" + _server_message(body,\
                \ 200)\n    try:\n        data = json.loads(_txt(body))\n    except\
                \ Exception:\n        return None, \"응답이 JSON 이 아니다\"\n    if not\
                \ isinstance(data, dict):\n        return None, \"응답 형식이 예상과 다르다\"\
                \n    return data, \"\"\n\n\ndef _repo_gate(repository, status_code,\
                \ body):\n    \"\"\"조회 권한 목록(GET /api/v1/sparql/repositories)으로 대상\
                \ repository 를 대조한다.\n\n    (중단 payload 또는 None, 조회 가능 ID 목록, warning).\
                \ 중단 payload 가 있으면 그대로 응답으로 쓴다.\n    목록 요청이 실패했고 repository 가 있으면\
                \ 대조를 건너뛰고 warning 만 남긴다.\"\"\"\n    repo = _txt(repository).strip()\n\
                \    data, reason = _json_body(status_code, body)\n    if data is\
                \ None:\n        if not repo:\n            return ({\"status\": \"\
                error\", \"repository\": \"\", \"repository_candidates\": [],\n  \
                \                   \"warning\": (\"repository_required: repository\
                \ 인자와 도구 설정의 기본 repository 가 \"\n                                \
                \ \"모두 비었다. kg_list_repositories 로 목록을 확인한 뒤 repository 를 넣어 \"\n\
                \                                 \"다시 부른다; repository_list_request_failed:\
                \ repository 목록 요청이 실패해 \"\n                                 \"후보를\
                \ 담지 못했다(\" + reason + \")\")},\n                    [], \"\")\n \
                \       return None, [], (\"repository_list_request_failed: repository\
                \ 목록 요청이 실패해 대조를 건너뛰었다(\"\n                          + reason + \"\
                )\")\n    listed = []\n    queryable = []\n    for entry in _list_of(data.get(\"\
                repositories\")):\n        rid = _txt(entry.get(\"id\")).strip()\n\
                \        if not rid:\n            continue\n        if rid not in\
                \ listed:\n            listed.append(rid)\n        if entry.get(\"\
                canQuery\") is True and rid not in queryable:\n            queryable.append(rid)\n\
                \    if not repo:\n        return ({\"status\": \"error\", \"repository\"\
                : \"\", \"repository_candidates\": queryable,\n                 \"\
                warning\": (\"repository_required: repository 인자와 도구 설정의 기본 repository\
                \ 가 모두 \"\n                             \"비었다. repository_candidates\
                \ 에서 골라 repository 에 넣어 다시 부른다\")},\n                queryable, \"\
                \")\n    if repo not in listed:\n        return ({\"status\": \"repository_not_found\"\
                , \"repository\": repo, \"repository_candidates\": queryable,\n  \
                \               \"warning\": (\"repository_not_found: \" + repo +\
                \ \" 는 이 계정이 볼 수 있는 repository 목록에 \"\n                          \
                \   \"없다. repository_candidates 에서 골라 다시 부른다\")},\n              \
                \  queryable, \"\")\n    if repo not in queryable:\n        return\
                \ ({\"status\": \"repository_not_found\", \"repository\": repo, \"\
                repository_candidates\": queryable,\n                 \"warning\"\
                : (\"repository_not_queryable: \" + repo + \" 는 이 계정에 조회 권한이 없다\"\n\
                \                             \"(canQuery false). repository_candidates\
                \ 에서 골라 다시 부른다\")},\n                queryable, \"\")\n    return\
                \ None, queryable, \"\"\n\n\nXSD_NS = \"http://www.w3.org/2001/XMLSchema#\"\
                \nPLAIN_DATATYPES = ['http://www.w3.org/2001/XMLSchema#string', 'http://www.w3.org/2001/XMLSchema#integer',\
                \ 'http://www.w3.org/2001/XMLSchema#int', 'http://www.w3.org/2001/XMLSchema#long',\
                \ 'http://www.w3.org/2001/XMLSchema#decimal', 'http://www.w3.org/2001/XMLSchema#double',\
                \ 'http://www.w3.org/2001/XMLSchema#float', 'http://www.w3.org/2001/XMLSchema#boolean',\
                \ 'http://www.w3.org/1999/02/22-rdf-syntax-ns#langString']\n\n\ndef\
                \ _xml_unescape(text):\n    \"\"\"XML 문자 참조 5종과 숫자 참조를 되돌린다.\"\"\"\
                \n    import re\n    out = _txt(text)\n    out = re.sub(r\"&#x([0-9A-Fa-f]+);\"\
                , lambda m: chr(int(m.group(1), 16)), out)\n    out = re.sub(r\"&#([0-9]+);\"\
                , lambda m: chr(int(m.group(1))), out)\n    for src, dst in ((\"&lt;\"\
                , \"<\"), (\"&gt;\", \">\"), (\"&quot;\", '\"'), (\"&apos;\", \"'\"\
                ), (\"&amp;\", \"&\")):\n        out = out.replace(src, dst)\n   \
                \ return out\n\n\ndef _sparql_xml(raw):\n    \"\"\"SPARQL Query Results\
                \ XML 을 JSON 형식과 같은 dict 로 읽는다. 읽지 못하면 None.\n\n    서버가 Accept 를 따르지\
                \ 않고 XML 을 줄 때를 대비한다(v1 SOR 5.x 실측).\"\"\"\n    import re\n    if\
                \ \"<sparql\" not in raw:\n        return None\n    variables = [_xml_unescape(v)\
                \ for v in re.findall(r\"<variable\\s+name=\\\"([^\\\"]*)\\\"\", raw)]\n\
                \    ask = re.search(r\"<boolean>\\s*(true|false)\\s*</boolean>\"\
                , raw)\n    if ask is not None:\n        return {\"head\": {\"vars\"\
                : variables}, \"boolean\": ask.group(1) == \"true\"}\n    if \"<results\"\
                \ not in raw:\n        return None\n    bindings = []\n    cell_re\
                \ = re.compile(\n        r\"<binding\\s+name=\\\"([^\\\"]*)\\\"\\\
                s*>\\s*(?:<uri>(.*?)</uri>|<bnode>(.*?)</bnode>\"\n        r\"|<literal((?:\\\
                s+[A-Za-z:]+=\\\"[^\\\"]*\\\")*)\\s*(?:/>|>(.*?)</literal>))\\s*</binding>\"\
                , re.S)\n    for block in re.findall(r\"<result>(.*?)</result>\",\
                \ raw, re.S):\n        row = {}\n        for name, uri, bnode, attrs,\
                \ literal in cell_re.findall(block):\n            key = _xml_unescape(name)\n\
                \            if uri:\n                row[key] = {\"type\": \"uri\"\
                , \"value\": _xml_unescape(uri.strip())}\n            elif bnode:\n\
                \                row[key] = {\"type\": \"bnode\", \"value\": _xml_unescape(bnode.strip())}\n\
                \            else:\n                cell = {\"type\": \"literal\"\
                , \"value\": _xml_unescape(literal)}\n                lang = re.search(r\"\
                xml:lang=\\\"([^\\\"]*)\\\"\", attrs)\n                if lang is\
                \ not None:\n                    cell[\"xml:lang\"] = _xml_unescape(lang.group(1))\n\
                \                datatype = re.search(r\"datatype=\\\"([^\\\"]*)\\\
                \"\", attrs)\n                if datatype is not None:\n         \
                \           cell[\"datatype\"] = _xml_unescape(datatype.group(1))\n\
                \                row[key] = cell\n        bindings.append(row)\n \
                \   return {\"head\": {\"vars\": variables}, \"results\": {\"bindings\"\
                : bindings}}\n\n\ndef _sparql_doc(body):\n    \"\"\"SPARQL 결과 본문을\
                \ JSON 형식 dict 로 읽는다. JSON 을 먼저, XML 을 다음으로 읽는다. 못 읽으면 None.\"\"\"\
                \n    import json\n    raw = _txt(body).strip()\n    if not raw:\n\
                \        return None\n    doc = None\n    if raw.startswith(\"{\"\
                ):\n        try:\n            doc = json.loads(raw)\n        except\
                \ Exception:\n            doc = None\n    if not isinstance(doc, dict):\n\
                \        doc = _sparql_xml(raw)\n    return doc if isinstance(doc,\
                \ dict) else None\n\n\ndef _cell(cell):\n    \"\"\"결과 한 칸을 문자열로 만든다.\
                \ 언어 태그는 값@ko, 기본 외 datatype 은 값^^xsd:date 처럼 붙인다.\"\"\"\n    if not\
                \ isinstance(cell, dict):\n        return \"\"\n    kind = _txt(cell.get(\"\
                type\"))\n    value = _txt(cell.get(\"value\"))\n    if kind == \"\
                bnode\":\n        return \"_:\" + value\n    if kind in (\"literal\"\
                , \"typed-literal\"):\n        lang = _txt(cell.get(\"xml:lang\"))\n\
                \        if lang:\n            return value + \"@\" + lang\n     \
                \   datatype = _txt(cell.get(\"datatype\"))\n        if datatype and\
                \ datatype not in PLAIN_DATATYPES:\n            if datatype.startswith(XSD_NS):\n\
                \                return value + \"^^xsd:\" + datatype[len(XSD_NS):]\n\
                \            return value + \"^^<\" + datatype + \">\"\n    return\
                \ value\n\n\ndef _sparql_rows(status_code, body):\n    \"\"\"default-value\
                \ 조회 노드의 SELECT 결과를 (binding 목록 또는 None, 실패 사유) 로 읽는다.\"\"\"\n   \
                \ code = _status(status_code)\n    if code == 0:\n        return None,\
                \ FAILED_REQUEST_REASON\n    if code != 200:\n        return None,\
                \ \"http_\" + str(code) + \": \" + _server_message(body, 200)\n  \
                \  doc = _sparql_doc(body)\n    if doc is None:\n        return None,\
                \ \"응답을 SPARQL 결과로 읽지 못했다\"\n    results = doc.get(\"results\")\n\
                \    if not isinstance(results, dict) or not isinstance(results.get(\"\
                bindings\"), list):\n        return [], \"\"\n    return [b for b\
                \ in results[\"bindings\"] if isinstance(b, dict)], \"\"\n\n\ndef\
                \ main(repos_body, repos_code, exact_body, exact_code, contains_body,\
                \ contains_code,\n         iri_body, iri_code, repository, name):\n\
                \    \"\"\"세 단계 결과를 exact, contains, iri 순으로 합쳐 후보를 만든다. IRI 가 겹치면\
                \ 앞의 것만 남긴다.\"\"\"\n    LIMIT = 20\n    TYPE_LIMIT = 10\n    GENERIC_TYPES\
                \ = ['http://www.w3.org/2002/07/owl#Thing', 'http://www.w3.org/2000/01/rdf-schema#Resource',\
                \ 'http://www.w3.org/2002/07/owl#NamedIndividual']\n    repo = _txt(repository).strip()\n\
                \    stop, _queryable, check_warning = _repo_gate(repo, repos_code,\
                \ repos_body)\n    if stop is not None:\n        stop[\"candidates\"\
                ] = []\n        stop[\"candidate_count\"] = 0\n        return {\"\
                payload\": stop}\n    warnings = [check_warning] if check_warning\
                \ else []\n    stages = ((\"exact\", exact_code, exact_body, \"exact_search_request_failed\"\
                , \"정확 일치 검색\"),\n              (\"contains\", contains_code, contains_body,\
                \ \"contains_search_request_failed\", \"포함 검색\"),\n              (\"\
                iri\", iri_code, iri_body, \"iri_search_request_failed\", \"IRI 끝\
                \ 이름 검색\"))\n    candidates = []\n    seen = set()\n    failed = 0\n\
                \    overflow = False\n    for match, code, body, tag, title in stages:\n\
                \        rows, reason = _sparql_rows(code, body)\n        if rows\
                \ is None:\n            failed += 1\n            warnings.append(tag\
                \ + \": \" + title + \" 요청이 실패했다(\" + reason + \")\")\n          \
                \  continue\n        if len(rows) > LIMIT:\n            overflow =\
                \ True\n        for row in rows:\n            subject = row.get(\"\
                s\")\n            if not isinstance(subject, dict) or _txt(subject.get(\"\
                type\")) != \"uri\":\n                continue\n            iri =\
                \ _txt(subject.get(\"value\")).strip()\n            if not iri or\
                \ iri in seen:\n                continue\n            seen.add(iri)\n\
                \            label_cell = row.get(\"label\")\n            label =\
                \ _txt(label_cell.get(\"value\")) if isinstance(label_cell, dict)\
                \ else \"\"\n            types_cell = row.get(\"types\")\n       \
                \     types = []\n            for type_iri in (_txt(types_cell.get(\"\
                value\")).split() if isinstance(types_cell, dict) else []):\n    \
                \            if type_iri not in types and type_iri not in GENERIC_TYPES:\n\
                \                    types.append(type_iri)\n            candidates.append({\"\
                iri\": iri, \"label\": label or _local_name(iri), \"match\": match,\n\
                \                               \"types\": types[:TYPE_LIMIT]})\n\
                \    if failed == len(stages):\n        return {\"payload\": {\"status\"\
                : \"error\", \"repository\": repo, \"repository_candidates\": [],\n\
                \                            \"candidates\": [], \"candidate_count\"\
                : 0,\n                            \"warning\": \"; \".join(warnings)\
                \ + ADMIN_HINT}}\n    if len(candidates) > LIMIT:\n        overflow\
                \ = True\n        candidates = candidates[:LIMIT]\n    if overflow:\n\
                \        warnings.append(\"too_many_matches: 후보가 \" + str(LIMIT) +\
                \ \"건을 넘어 잘렸다. 이름을 길게 하거나 \"\n                        \"class_iri\
                \ 로 좁혀 다시 부른다\")\n    if candidates:\n        status = \"success\"\
                \n    elif failed:\n        status = \"no_results\"\n        warnings.append(\"\
                result_incomplete: 성공한 검색에서는 \" + _txt(name) + \" 에 맞는 후보가 없지만 검색\
                \ 요청 \"\n                        \"일부가 실패해 없다고 단정할 수 없다. 이름을 길게 하거나\
                \ class_iri 로 좁혀 한 번만 더 \"\n                        \"부르고, 같으면 관리자에게\
                \ 계정 설정과 서버 상태 확인이 필요하다고 답한다\")\n    else:\n        status = \"no_results\"\
                \n        warnings.append(\"no_results: \" + _txt(name) + \" 에 맞는\
                \ label 과 IRI 가 없다. 핵심 낱말로 줄이거나 \"\n                        \"class_iri\
                \ 를 비워 한 번만 더 부르고, 그래도 없으면 찾지 못했다고 답한다\")\n    return {\"payload\"\
                : {\"status\": status, \"repository\": repo, \"repository_candidates\"\
                : [],\n                        \"candidates\": candidates, \"candidate_count\"\
                : len(candidates),\n                        \"warning\": \"; \".join(w\
                \ for w in warnings if w)}}\n"
              variables:
              - variable: repos_body
                value_selector:
                - q_repos
                - body
              - variable: repos_code
                value_selector:
                - q_repos
                - status_code
              - variable: exact_body
