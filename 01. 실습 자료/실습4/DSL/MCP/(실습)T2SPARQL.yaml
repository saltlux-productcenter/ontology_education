                \ \".join(_txt(text).split()), limit)\n\n\ndef _local_name(iri):\n\
                \    \"\"\"IRI 의 마지막 #, /, : 뒤 이름. 없으면 원문.\"\"\"\n    text = _txt(iri).strip()\n\
                \    cut = max(text.rfind(\"#\"), text.rfind(\"/\"), text.rfind(\"\
                :\"))\n    tail = text[cut + 1:] if cut >= 0 else text\n    return\
                \ tail or text\n\n\ndef _list_of(value):\n    \"\"\"dict 원소만 남긴 목록.\
                \ 목록이 아니면 빈 목록.\"\"\"\n    if not isinstance(value, list):\n     \
