                \ prefix 요청이 실패해 expression 에 표준 prefix 만 썼다(\"\n                \
                \        + prefix_reason + \")\")\n    entity, entity_reason = _json_body(entity_code,\
                \ entity_body)\n    outgoing_data, out_reason = _json_body(out_code,\
                \ out_body)\n    incoming_data, in_reason = _json_body(in_code, in_body)\n\
                \    usage_data, usage_reason = _json_body(usage_code, usage_body)\n\
                \    failures = []\n    if entity is None:\n        failures.append(\"\
                entity_request_failed: 스키마 공리 요청이 실패했다(\" + entity_reason + \")\"\
                )\n    if outgoing_data is None:\n        failures.append(\"outgoing_request_failed:\
                \ 나가는 문장 요청이 실패했다(\" + out_reason + \")\")\n    if incoming_data is\
                \ None:\n        failures.append(\"incoming_request_failed: 들어오는 문장\
                \ 요청이 실패했다(\" + in_reason + \")\")\n    if usage_data is None:\n \
                \       failures.append(\"usage_request_failed: 사용처 요청이 실패했다(\" +\
                \ usage_reason + \")\")\n    if entity is None and outgoing_data is\
                \ None and incoming_data is None:\n        payload = {\"status\":\
                \ \"error\", \"repository\": repo, \"repository_candidates\": [],\n\
                \                   \"warning\": \"; \".join(warnings + failures)\
                \ + ADMIN_HINT}\n        payload.update(empty)\n        return {\"\
                payload\": payload}\n    warnings += failures\n\n    statements =\
                \ _list_of(entity.get(\"statements\")) if entity is not None else\
                \ []\n    closure = _closure_map(entity.get(\"closure\")) if entity\
                \ is not None else {}\n    inherited = _list_of(entity.get(\"inheritedStatements\"\
                )) if entity is not None else []\n    raw_parents = entity.get(\"\
                parents\") if entity is not None else None\n    out_statements = _list_of(outgoing_data.get(\"\
                statements\")) if outgoing_data is not None else []\n    in_statements\
                \ = _list_of(incoming_data.get(\"statements\")) if incoming_data is\
                \ not None else []\n    usage_statements = _list_of(usage_data.get(\"\
                statements\")) if usage_data is not None else []\n    ctx = {\"prefixes\"\
                : prefixes, \"closure\": closure}\n\n    def term_value(term):\n \
                \       if _txt(term.get(\"type\")) == \"bnode\":\n            return\
                \ \"_:\" + _txt(term.get(\"value\"))\n        return _txt(term.get(\"\
                value\"))\n\n    types = []\n    labels = []\n    seen_labels = set()\n\
                \    for statement in statements + out_statements:\n        predicate\
                \ = _txt(_term_of(statement, \"predicate\").get(\"value\"))\n    \
                \    obj = _term_of(statement, \"object\")\n        if predicate ==\
                \ RDF_NS + \"type\" and _txt(obj.get(\"type\")) == \"uri\":\n    \
                \        type_iri = _txt(obj.get(\"value\"))\n            if type_iri\
                \ and type_iri not in types:\n                types.append(type_iri)\n\
                \        elif predicate in LABEL_PREDICATES and _txt(obj.get(\"type\"\
                )) == \"literal\":\n            key = _txt(obj.get(\"value\")) + \"\
                @\" + _txt(obj.get(\"xml:lang\"))\n            if key not in seen_labels\
                \ and len(labels) < LABEL_LIMIT:\n                seen_labels.add(key)\n\
                \                labels.append({\"value\": _txt(obj.get(\"value\"\
                )), \"lang\": _txt(obj.get(\"xml:lang\"))})\n\n    if any(t in CLASS_TYPES\
                \ for t in types):\n        kind = \"class\"\n    elif any(t in PROPERTY_TYPES\
                \ for t in types):\n        kind = \"property\"\n    elif statements\
                \ or out_statements or in_statements or usage_statements:\n      \
                \  kind = \"instance\"\n    else:\n        kind = \"not_found\"\n\n\
                \    order_index = {}\n    for position, predicate in enumerate(AXIOM_ORDER):\n\
                \        order_index[predicate] = position\n    ranked = []\n    for\
                \ position, statement in enumerate(statements):\n        predicate\
                \ = _txt(_term_of(statement, \"predicate\").get(\"value\"))\n    \
                \    if not predicate:\n            continue\n        ranked.append((order_index.get(predicate,\
                \ len(AXIOM_ORDER)), position, statement))\n    ranked.sort(key=lambda\
                \ entry: (entry[0], entry[1]))\n    axioms = [_axiom(entry[2], ctx)\
                \ for entry in ranked]\n    if len(axioms) > AXIOM_LIMIT:\n      \
                \  warnings.append(\"truncated: 공리가 \" + str(len(axioms)) + \"건이라\
                \ 앞 \" + str(AXIOM_LIMIT) + \"건만 담았다\")\n        axioms = axioms[:AXIOM_LIMIT]\n\
                \    inherited_axioms = []\n    for statement in inherited:\n    \
                \    item = _axiom(statement, ctx)\n        item[\"from\"] = _txt(_term_of(statement,\
                \ \"subject\").get(\"value\"))\n        inherited_axioms.append(item)\n\
                \    if len(inherited_axioms) > INHERITED_LIMIT:\n        warnings.append(\"\
                truncated: 상속 공리가 \" + str(len(inherited_axioms)) + \"건이라 앞 \"\n \
                \                       + str(INHERITED_LIMIT) + \"건만 담았다\")\n   \
                \     inherited_axioms = inherited_axioms[:INHERITED_LIMIT]\n    parents\
                \ = [_txt(p).strip() for p in (raw_parents if isinstance(raw_parents,\
                \ list) else []) if _txt(p).strip()]\n\n    outgoing = []\n    for\
                \ statement in out_statements[:OUTGOING_LIMIT]:\n        obj = _term_of(statement,\
                \ \"object\")\n        outgoing.append({\"predicate\": _txt(_term_of(statement,\
                \ \"predicate\").get(\"value\")),\n                         \"object\"\
                : term_value(obj), \"object_type\": _txt(obj.get(\"type\")),\n   \
                \                      \"lang\": _txt(obj.get(\"xml:lang\")), \"datatype\"\
                : _txt(obj.get(\"datatype\"))})\n    incoming = []\n    for statement\
                \ in in_statements[:INCOMING_LIMIT]:\n        incoming.append({\"\
                subject\": term_value(_term_of(statement, \"subject\")),\n       \
                \                  \"predicate\": _txt(_term_of(statement, \"predicate\"\
                ).get(\"value\"))})\n    usage = []\n    for statement in usage_statements[:USAGE_LIMIT]:\n\
                \        usage.append({\"subject\": term_value(_term_of(statement,\
                \ \"subject\")),\n                      \"predicate\": _txt(_term_of(statement,\
                \ \"predicate\").get(\"value\")),\n                      \"object\"\
                : term_value(_term_of(statement, \"object\"))})\n    has_more = {\n\
                \        \"outgoing\": (outgoing_data is not None and outgoing_data.get(\"\
                hasMore\") is True)\n        or len(out_statements) > OUTGOING_LIMIT,\n\
                \        \"incoming\": (incoming_data is not None and incoming_data.get(\"\
                hasMore\") is True)\n        or len(in_statements) > INCOMING_LIMIT,\n\
                \        \"usage\": (usage_data is not None and usage_data.get(\"\
                hasMore\") is True)\n        or len(usage_statements) > USAGE_LIMIT,\n\
                \    }\n\n    if kind == \"not_found\":\n        if failures:\n  \
                \          # 받은 문장이 없어도 요청 일부가 실패했으면 대상이 없다고 단정하지 않는다.\n         \
                \   kind = \"unknown\"\n            status = \"error\"\n         \
                \   warnings.append(\"result_incomplete: 받은 문장이 없지만 요청 일부가 실패해 대상이\
                \ 없다고 단정할 수 \"\n                            \"없다\" + ADMIN_HINT)\n\
                \        else:\n            status = \"no_results\"\n            warnings.append(\"\
                not_found: 이 IRI 를 쓰는 스키마 문장과 데이터 문장이 없다. IRI 를 지어낸 것이 \"\n      \
                \                      \"아닌지 kg_search_entities 나 kg_describe_schema\
                \ 로 확인한다\")\n    else:\n        status = \"success\"\n    return {\"\
                payload\": {\"status\": status, \"repository\": repo, \"repository_candidates\"\
                : [],\n                        \"iri\": target, \"kind\": kind, \"\
                labels\": labels, \"types\": types, \"axioms\": axioms,\n        \
                \                \"inherited_axioms\": inherited_axioms, \"parents\"\
                : parents, \"outgoing\": outgoing,\n                        \"incoming\"\
                : incoming, \"usage\": usage, \"has_more\": has_more,\n          \
                \              \"warning\": \"; \".join(w for w in warnings if w)}}\n"
