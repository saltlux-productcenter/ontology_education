                \        return -1\n        index += 1\n    return -1\n\n\ndef _string_end(text,\
                \ start):\n    \"\"\"text[start] 가 따옴표일 때 문자열 literal 다음 위치.\"\"\"\
                \n    quote = text[start]\n    if text[start:start + 3] == quote *\
                \ 3:\n        end = text.find(quote * 3, start + 3)\n        return\
                \ len(text) if end == -1 else end + 3\n    index = start + 1\n   \
                \ while index < len(text):\n        ch = text[index]\n        if ch\
                \ == \"\\\\\":\n            index += 2\n            continue\n   \
