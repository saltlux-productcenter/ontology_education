                \    body = body.replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\
                \\\"')\n    body = body.replace(\"\\r\\n\", \"\\n\").replace(\"\\\
                r\", \"\\n\").replace(\"\\n\", \"\\\\n\")\n    return '\"' + body\
                \ + '\"'\n\n\ndef main(repository_arg, name, class_iri, base, username,\
                \ default_repo, inferred, federation, timeout_ms):\n    \"\"\"이름과\
                \ class_iri 를 검사하고 label 검색 SPARQL 3건(정확 일치, 포함, IRI 끝 이름)의 주소를 만든다.\"\
                \"\"\n    PREFIXES = 'PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\
                \ PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> PREFIX skos:\
                \ <http://www.w3.org/2004/02/skos/core#> '\n    LIMIT = 20 + 1\n \
                \   base_url = _base_url(base)\n    repository = _txt(repository_arg).strip()\
                \ or _txt(default_repo).strip()\n    target = \" \".join(_txt(name).split())\n\
                \    out = {\"base_url\": base_url, \"repository\": repository, \"\
                route\": \"go\", \"stop_payload\": {},\n           \"name\": target,\
                \ \"class_iri\": \"\",\n           \"repos_url\": _build_url(base_url,\
                \ \"/api/v1/sparql/repositories\", [])[0],\n           \"exact_url\"\
