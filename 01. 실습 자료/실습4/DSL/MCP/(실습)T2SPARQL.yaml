            data:
              type: code
              title: 응답 정리
              desc: repository 를 대조한 뒤 class, property, 관계, prefix 를 합치고 상한을 적용한다
              code_language: python3
              code: "\ndef _txt(value):\n    \"\"\"None 과 숫자를 포함해 무엇이 오든 문자열로 만든다.\"\
                \"\"\n    return \"\" if value is None else str(value)\n\n\ndef _cut(text,\
                \ limit):\n    body = _txt(text)\n    return body if len(body) <=\
                \ limit else body[:limit]\n\n\ndef _one_line(text, limit):\n    \"\
                \"\"줄바꿈과 연속 공백을 한 칸으로 줄이고 limit 자에서 자른다.\"\"\"\n    return _cut(\"\
                \ \".join(_txt(text).split()), limit)\n\n\ndef _local_name(iri):\n\
                \    \"\"\"IRI 의 마지막 #, /, : 뒤 이름. 없으면 원문.\"\"\"\n    text = _txt(iri).strip()\n\
                \    cut = max(text.rfind(\"#\"), text.rfind(\"/\"), text.rfind(\"\
                :\"))\n    tail = text[cut + 1:] if cut >= 0 else text\n    return\
                \ tail or text\n\n\ndef _list_of(value):\n    \"\"\"dict 원소만 남긴 목록.\
                \ 목록이 아니면 빈 목록.\"\"\"\n    if not isinstance(value, list):\n     \
                \   return []\n    return [item for item in value if isinstance(item,\
                \ dict)]\n\n\ndef _term_of(statement, key):\n    \"\"\"statement 의\
                \ subject, predicate, object term. dict 가 아니면 빈 dict.\"\"\"\n    value\
                \ = statement.get(key) if isinstance(statement, dict) else None\n\
                \    return value if isinstance(value, dict) else {}\n\n\n# default-value\
                \ 를 건 노드가 실패하면 원인과 무관하게 status 0 과 빈 body 가 온다. 그래서 warning 은 원인을\n\
                # 단정하지 않고 실패 사실만 적는다(login_failed, <대상>_request_failed).\nFAILED_REQUEST_REASON\
                \ = (\"요청이 실패했다. 서버 접속 실패, 권한 거절, timeout, 4xx, 5xx 는 실패 시 기본값(status\
                \ 0)으로 \"\n                         \"바뀌어 이 도구가 구분하지 못하며, 구분은 워크플로\
                \ 실행 기록의 오류 원문으로 한다\")\nADMIN_HINT = \". 다시 부르지 말고 관리자에게 계정 설정과 서버\
                \ 상태 확인이 필요하다고 답한다\"\n\n\ndef _status(status_code):\n    try:\n  \
                \      return int(float(_txt(status_code).strip() or \"0\"))\n   \
                \ except Exception:\n        return 0\n\n\ndef _header(headers, name):\n\
                \    \"\"\"응답 header 를 대소문자 구분 없이 찾는다. 없으면 빈 문자열.\"\"\"\n    if not\
                \ isinstance(headers, dict):\n        return \"\"\n    want = name.lower()\n\
                \    for key, value in headers.items():\n        if _txt(key).strip().lower()\
                \ == want:\n            return _txt(value).strip()\n    return \"\"\
                \n\n\ndef _server_message(body, limit, headers=None):\n    \"\"\"\
                서버 오류 본문 {timestamp, status, error, message, code, correlationId}\
                \ 에서 message 와\n    correlationId 를 꺼낸다. JSON 이 아니면 본문 원문을 한 줄로 줄여\
                \ 쓴다.\"\"\"\n    import json\n    raw = _txt(body)\n    data = None\n\
                \    if raw.strip().startswith(\"{\"):\n        try:\n           \
                \ data = json.loads(raw)\n        except Exception:\n            data\
                \ = None\n    message = \"\"\n    correlation = \"\"\n    if isinstance(data,\
                \ dict):\n        message = _txt(data.get(\"message\")).strip() or\
                \ _txt(data.get(\"error\")).strip()\n        correlation = _txt(data.get(\"\
                correlationId\")).strip()\n    if not message:\n        message =\
                \ raw\n    text = _one_line(message, limit)\n    if not correlation:\n\
                \        correlation = _header(headers, \"x-correlation-id\")\n  \
                \  if correlation:\n        text = text + \" (correlationId \" + correlation\
                \ + \")\"\n    return text\n\n\ndef _json_body(status_code, body):\n\
                \    \"\"\"조회 노드의 응답을 JSON 객체로 읽는다. (객체 또는 None, 실패 사유).\"\"\"\n \
                \   import json\n    code = _status(status_code)\n    if code == 0:\n\
                \        return None, FAILED_REQUEST_REASON\n    if code != 200:\n\
                \        return None, \"http_\" + str(code) + \": \" + _server_message(body,\
                \ 200)\n    try:\n        data = json.loads(_txt(body))\n    except\
                \ Exception:\n        return None, \"응답이 JSON 이 아니다\"\n    if not\
                \ isinstance(data, dict):\n        return None, \"응답 형식이 예상과 다르다\"\
                \n    return data, \"\"\n\n\ndef _repo_gate(repository, status_code,\
                \ body):\n    \"\"\"조회 권한 목록(GET /api/v1/sparql/repositories)으로 대상\
                \ repository 를 대조한다.\n\n    (중단 payload 또는 None, 조회 가능 ID 목록, warning).\
                \ 중단 payload 가 있으면 그대로 응답으로 쓴다.\n    목록 요청이 실패했고 repository 가 있으면\
                \ 대조를 건너뛰고 warning 만 남긴다.\"\"\"\n    repo = _txt(repository).strip()\n\
                \    data, reason = _json_body(status_code, body)\n    if data is\
                \ None:\n        if not repo:\n            return ({\"status\": \"\
                error\", \"repository\": \"\", \"repository_candidates\": [],\n  \
                \                   \"warning\": (\"repository_required: repository\
                \ 인자와 도구 설정의 기본 repository 가 \"\n                                \
                \ \"모두 비었다. kg_list_repositories 로 목록을 확인한 뒤 repository 를 넣어 \"\n\
                \                                 \"다시 부른다; repository_list_request_failed:\
                \ repository 목록 요청이 실패해 \"\n                                 \"후보를\
                \ 담지 못했다(\" + reason + \")\")},\n                    [], \"\")\n \
                \       return None, [], (\"repository_list_request_failed: repository\
                \ 목록 요청이 실패해 대조를 건너뛰었다(\"\n                          + reason + \"\
                )\")\n    listed = []\n    queryable = []\n    for entry in _list_of(data.get(\"\
                repositories\")):\n        rid = _txt(entry.get(\"id\")).strip()\n\
                \        if not rid:\n            continue\n        if rid not in\
                \ listed:\n            listed.append(rid)\n        if entry.get(\"\
                canQuery\") is True and rid not in queryable:\n            queryable.append(rid)\n\
                \    if not repo:\n        return ({\"status\": \"error\", \"repository\"\
                : \"\", \"repository_candidates\": queryable,\n                 \"\
                warning\": (\"repository_required: repository 인자와 도구 설정의 기본 repository\
                \ 가 모두 \"\n                             \"비었다. repository_candidates\
                \ 에서 골라 repository 에 넣어 다시 부른다\")},\n                queryable, \"\
                \")\n    if repo not in listed:\n        return ({\"status\": \"repository_not_found\"\
                , \"repository\": repo, \"repository_candidates\": queryable,\n  \
                \               \"warning\": (\"repository_not_found: \" + repo +\
                \ \" 는 이 계정이 볼 수 있는 repository 목록에 \"\n                          \
                \   \"없다. repository_candidates 에서 골라 다시 부른다\")},\n              \
                \  queryable, \"\")\n    if repo not in queryable:\n        return\
                \ ({\"status\": \"repository_not_found\", \"repository\": repo, \"\
                repository_candidates\": queryable,\n                 \"warning\"\
                : (\"repository_not_queryable: \" + repo + \" 는 이 계정에 조회 권한이 없다\"\n\
                \                             \"(canQuery false). repository_candidates\
                \ 에서 골라 다시 부른다\")},\n                queryable, \"\")\n    return\
                \ None, queryable, \"\"\n\n\nSTD_PREFIXES = {'rdf': 'http://www.w3.org/1999/02/22-rdf-syntax-ns#',\
                \ 'rdfs': 'http://www.w3.org/2000/01/rdf-schema#', 'owl': 'http://www.w3.org/2002/07/owl#',\
                \ 'xsd': 'http://www.w3.org/2001/XMLSchema#', 'skos': 'http://www.w3.org/2004/02/skos/core#'}\n\
                \n\ndef _prefix_map(status_code, body):\n    \"\"\"저장소 prefix 를 {prefix:\
                \ namespace} 로 읽고, 표준 prefix 는 비어 있는 자리에만 더한다.\n\n    (prefix 사전,\
                \ 실패 사유). 실패해도 표준 prefix 는 담는다.\"\"\"\n    data, reason = _json_body(status_code,\
                \ body)\n    prefixes = {}\n    if data is not None and isinstance(data.get(\"\
                prefixes\"), dict):\n        for key, value in data[\"prefixes\"].items():\n\
                \            namespace = _txt(value).strip()\n            if namespace:\n\
                \                prefixes[_txt(key).strip()] = namespace\n    namespaces\
                \ = set(prefixes.values())\n    for key, value in STD_PREFIXES.items():\n\
                \        if key not in prefixes and value not in namespaces:\n   \
                \         prefixes[key] = value\n    return prefixes, (\"\" if data\
                \ is not None else reason)\n\n\ndef _short(iri, prefixes):\n    \"\
                \"\"등록된 namespace 가운데 가장 긴 것으로 prefix:name 을 만든다. 없으면 <IRI>.\"\"\"\
                \n    text = _txt(iri)\n    best_ns = \"\"\n    best_prefix = \"\"\
                \n    for prefix, namespace in prefixes.items():\n        ns = _txt(namespace)\n\
                \        if ns and text.startswith(ns) and len(ns) > len(best_ns):\n\
                \            best_ns = ns\n            best_prefix = _txt(prefix)\n\
                \    if best_ns and len(text) > len(best_ns):\n        return best_prefix\
                \ + \":\" + text[len(best_ns):]\n    return \"<\" + text + \">\"\n\
                \n\ndef _pick_label(labels):\n    \"\"\"labels([{value, xml:lang}]\
                \ 또는 문자열 목록)에서 ko, en, 첫 값 순으로 고른다.\"\"\"\n    items = []\n    for\
                \ entry in (labels if isinstance(labels, list) else []):\n       \
                \ if isinstance(entry, dict):\n            items.append((_txt(entry.get(\"\
                value\")), _txt(entry.get(\"xml:lang\") or entry.get(\"lang\")).lower()))\n\
                \        elif entry is not None:\n            items.append((_txt(entry),\
                \ \"\"))\n    for want in (\"ko\", \"en\"):\n        for value, lang\
                \ in items:\n            if value and (lang == want or lang.startswith(want\
                \ + \"-\")):\n                return value\n    for value, _lang in\
                \ items:\n        if value:\n            return value\n    return\
                \ \"\"\n\n\ndef main(repos_body, repos_code, prefixes_body, prefixes_code,\
                \ overview_body, overview_code,\n         class_body, class_code,\
                \ object_body, object_code, data_body, data_code, repository, mode):\n\
                \    \"\"\"overview 와 명시 스키마 목록을 합쳐 class, property, 관계, prefix 를\
                \ 만든다.\"\"\"\n    CLASS_LIMIT = 60\n    OBJECT_LIMIT = 60\n    DATA_LIMIT\
                \ = 60\n    RELATION_LIMIT = 120\n    repo = _txt(repository).strip()\n\
                \    view = _txt(mode) or \"overview\"\n    stop, _queryable, check_warning\
                \ = _repo_gate(repo, repos_code, repos_body)\n    if stop is not None:\n\
                \        stop[\"mode\"] = view\n        return {\"payload\": stop}\n\
                \    warnings = [check_warning] if check_warning else []\n    truncated\
                \ = False\n\n    prefixes, prefix_reason = _prefix_map(prefixes_code,\
                \ prefixes_body)\n    if prefix_reason:\n        warnings.append(\"\
                prefixes_request_failed: prefix 요청이 실패해 표준 prefix 만 담았다(\" + prefix_reason\
                \ + \")\")\n    overview, overview_reason = _json_body(overview_code,\
                \ overview_body)\n    class_data, class_reason = _json_body(class_code,\
                \ class_body)\n    object_data, object_reason = _json_body(object_code,\
                \ object_body)\n    data_data, data_reason = _json_body(data_code,\
                \ data_body)\n    failures = []\n    if overview is None:\n      \
                \  failures.append(\"overview_request_failed: 스키마 요약 요청이 실패해 class\
                \ 별 instance 수와 관계가 \"\n                        \"비었다(\" + overview_reason\
                \ + \")\")\n    if class_data is None:\n        failures.append(\"\
                class_list_request_failed: class 목록 요청이 실패했다(\" + class_reason + \"\
                )\")\n    if object_data is None:\n        failures.append(\"object_property_list_request_failed:\
                \ object property 목록 요청이 실패했다(\"\n                        + object_reason\
                \ + \")\")\n    if data_data is None:\n        failures.append(\"\
                data_property_list_request_failed: data property 목록 요청이 실패했다(\" +\
                \ data_reason + \")\")\n    if len(failures) == 4:\n        return\
                \ {\"payload\": {\"status\": \"error\", \"repository\": repo, \"repository_candidates\"\
                : [], \"mode\": view,\n                            \"prefixes\": prefixes,\n\
                \                            \"warning\": \"; \".join(warnings + failures)\
                \ + ADMIN_HINT}}\n    warnings += failures\n\n    by_iri = {}\n  \
                \  order = []\n\n    def slot(iri):\n        if iri not in by_iri:\n\
                \            by_iri[iri] = {\"iri\": iri, \"label\": \"\", \"instance_count\"\
                : -1, \"count_kind\": \"unknown\",\n                           \"\
                parents\": []}\n            order.append(iri)\n        return by_iri[iri]\n\
                \n    def parents_of(entity):\n        raw = entity.get(\"parents\"\
                )\n        return [_txt(p).strip() for p in (raw if isinstance(raw,\
                \ list) else []) if _txt(p).strip()]\n\n    def more_than(data, returned):\n\
                \        total = data.get(\"total\")\n        return isinstance(total,\
                \ int) and not isinstance(total, bool) and total > returned\n\n  \
                \  if overview is not None:\n        for group in _list_of(overview.get(\"\
                groups\")):\n            iri = _txt(group.get(\"iri\")).strip()\n\
                \            if not iri:\n                continue\n            item\
                \ = slot(iri)\n            if not item[\"label\"]:\n             \
                \   item[\"label\"] = _txt(group.get(\"label\")).strip()\n       \
                \     kind = _txt(group.get(\"localCountKind\")).strip().upper()\n\
                \            try:\n                count = int(group.get(\"localCount\"\
                ))\n            except Exception:\n                count = -1\n  \
                \          if count >= 0 and kind == \"EXACT\":\n                item[\"\
                instance_count\"] = count\n                item[\"count_kind\"] =\
                \ \"exact\"\n            elif count >= 0 and kind != \"UNKNOWN\":\n\
                \                item[\"instance_count\"] = count\n              \
                \  item[\"count_kind\"] = \"at_least\"\n        if overview.get(\"\
                hasMore\") is True:\n            truncated = True\n\n    if class_data\
                \ is not None:\n        entities = _list_of(class_data.get(\"entities\"\
                ))\n        for entity in entities:\n            iri = _txt(entity.get(\"\
                iri\")).strip()\n            if not iri:\n                continue\n\
                \            item = slot(iri)\n            label = _pick_label(entity.get(\"\
                labels\"))\n            if label:\n                item[\"label\"\
                ] = label\n            parents = parents_of(entity)\n            if\
                \ parents:\n                item[\"parents\"] = parents\n        if\
                \ more_than(class_data, len(entities)):\n            truncated = True\n\
                \n    classes = [by_iri[iri] for iri in order]\n    for item in classes:\n\
                \        if not item[\"label\"]:\n            item[\"label\"] = _local_name(item[\"\
                iri\"])\n    classes.sort(key=lambda item: (1 if item[\"instance_count\"\
                ] < 0 else 0, -item[\"instance_count\"], item[\"label\"]))\n    if\
                \ len(classes) > CLASS_LIMIT:\n        truncated = True\n        classes\
                \ = classes[:CLASS_LIMIT]\n\n    def read_properties(data, limit):\n\
                \        items = []\n        more = False\n        entities = _list_of(data.get(\"\
                entities\"))\n        for entity in entities:\n            iri = _txt(entity.get(\"\
                iri\")).strip()\n            if not iri:\n                continue\n\
                \            items.append({\"iri\": iri, \"label\": _pick_label(entity.get(\"\
                labels\")) or _local_name(iri),\n                          \"parents\"\
                : parents_of(entity)})\n        if more_than(data, len(entities))\
                \ or len(items) > limit:\n            more = True\n        return\
                \ items[:limit], more\n\n    object_properties = []\n    if object_data\
                \ is not None:\n        object_properties, more = read_properties(object_data,\
                \ OBJECT_LIMIT)\n        truncated = truncated or more\n    data_properties\
                \ = []\n    if data_data is not None:\n        data_properties, more\
                \ = read_properties(data_data, DATA_LIMIT)\n        truncated = truncated\
                \ or more\n\n    relations = []\n    if overview is not None:\n  \
                \      for edge in _list_of(overview.get(\"edges\")):\n          \
                \  source = _txt(edge.get(\"source\")).strip()\n            target\
                \ = _txt(edge.get(\"target\")).strip()\n            predicate = _txt(edge.get(\"\
                predicate\")).strip()\n            if not (source and target and predicate):\n\
                \                continue\n            relations.append({\"source\"\
                : source, \"predicate\": predicate, \"target\": target,\n        \
                \                      \"kind\": _txt(edge.get(\"kind\")).strip()})\n\
                \    rank = {\"SCHEMA\": 0, \"OBSERVED_SAMPLE\": 1}\n    relations.sort(key=lambda\
                \ item: rank.get(item[\"kind\"].upper(), 2))\n    if len(relations)\
                \ > RELATION_LIMIT:\n        truncated = True\n        relations =\
                \ relations[:RELATION_LIMIT]\n\n    if not classes and not object_properties\
                \ and not data_properties and not relations:\n        status = \"\
                no_results\"\n        if failures:\n            warnings.append(\"\
                result_incomplete: 받은 결과가 없지만 요청 일부가 실패해 결과가 없다고 단정할 수 없다. \"\n  \
                \                          \"한 번 더 부르고 같으면 관리자에게 계정 설정과 서버 상태 확인이\
                \ 필요하다고 답한다\")\n        elif view == \"search\":\n            warnings.append(\"\
                no_results: keyword 에 맞는 class, property, 관계가 없다. 더 짧은 낱말이나 영어 \"\n\
                \                            \"이름으로 바꾸거나 keyword 를 비워 개요를 받는다\")\n\
                \        else:\n            warnings.append(\"no_results: 스키마에 class\
                \ 와 property 가 보이지 않는다. repository 가 비었거나 \"\n                   \
                \         \"열려 있지 않을 수 있으므로 kg_list_repositories 의 state 를 확인한다\"\
                )\n    else:\n        status = \"success\"\n    if truncated:\n  \
                \      warnings.append(\"truncated: class \" + str(CLASS_LIMIT) +\
                \ \"건, property 각 \" + str(OBJECT_LIMIT)\n                       \
                \ + \"건, 관계 \" + str(RELATION_LIMIT) + \"건 상한이나 서버 페이지에서 잘렸다. keyword\
                \ 로 \"\n                        \"좁혀 다시 부른다\")\n    return {\"payload\"\
                : {\"status\": status, \"repository\": repo, \"repository_candidates\"\
                : [], \"mode\": view,\n                        \"classes\": classes,\
                \ \"object_properties\": object_properties,\n                    \
                \    \"data_properties\": data_properties, \"relations\": relations,\
                \ \"prefixes\": prefixes,\n                        \"truncated\":\
                \ truncated, \"warning\": \"; \".join(w for w in warnings if w)}}\n"
