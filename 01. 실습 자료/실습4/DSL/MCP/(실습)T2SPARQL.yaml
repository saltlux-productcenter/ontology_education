              code_language: python3
              code: "\ndef _txt(value):\n    \"\"\"None 과 숫자를 포함해 무엇이 오든 문자열로 만든다.\"\
                \"\"\n    return \"\" if value is None else str(value)\n\n\ndef _cut(text,\
                \ limit):\n    body = _txt(text)\n    return body if len(body) <=\
                \ limit else body[:limit]\n\n\ndef _one_line(text, limit):\n    \"\
                \"\"줄바꿈과 연속 공백을 한 칸으로 줄이고 limit 자에서 자른다.\"\"\"\n    return _cut(\"\
                \ \".join(_txt(text).split()), limit)\n\n\ndef _local_name(iri):\n\
                \    \"\"\"IRI 의 마지막 #, /, : 뒤 이름. 없으면 원문.\"\"\"\n    text = _txt(iri).strip()\n\
                \    cut = max(text.rfind(\"#\"), text.rfind(\"/\"), text.rfind(\"\
                :\"))\n    tail = text[cut + 1:] if cut >= 0 else text\n    return\
                \ tail or text\n\n\ndef _list_of(value):\n    \"\"\"dict 원소만 남긴 목록.\
                \ 목록이 아니면 빈 목록.\"\"\"\n    if not isinstance(value, list):\n     \
                \   return []\n    return [item for item in value if isinstance(item,\
                \ dict)]\n\n\ndef _term_of(statement, key):\n    \"\"\"statement 의\
                \ subject, predicate, object term. dict 가 아니면 빈 dict.\"\"\"\n    value\
                \ = statement.get(key) if isinstance(statement, dict) else None\n\
                \    return value if isinstance(value, dict) else {}\n\n\ndef _flag(value,\
                \ default):\n    text = _txt(value).strip().lower()\n    if text in\
                \ (\"true\", \"1\", \"yes\", \"y\", \"on\"):\n        return \"true\"\
                \n    if text in (\"false\", \"0\", \"no\", \"n\", \"off\"):\n   \
                \     return \"false\"\n    return default\n\n\ndef _timeout_ms(value):\n\
                \    try:\n        number = int(float(_txt(value).strip()))\n    except\
                \ Exception:\n        number = 30000\n    return max(1000, min(110000,\
                \ number))\n\n\ndef _base_url(value):\n    \"\"\"끝의 / 와 /admin 을 떼어\
                \ 서버 root 로 만든다.\"\"\"\n    text = _txt(value).strip().rstrip(\"/\"\
                )\n    if text.lower().endswith(\"/admin\"):\n        text = text[:-len(\"\
                /admin\")].rstrip(\"/\")\n    return text\n\n\ndef _config_error(base_url,\
                \ username):\n    \"\"\"설정이 비었거나 CHANGE-ME 자리표시자면 config_missing,\
                \ 형식이 틀리면 config_invalid.\"\"\"\n    problems = []\n    lower = base_url.lower()\n\
                \    if not base_url or \"CHANGE-ME\" in base_url.upper():\n     \
                \   problems.append(\"config_missing: SOR_BASE_URL\")\n    elif not\
                \ (lower.startswith(\"http://\") or lower.startswith(\"https://\"\
                )):\n        problems.append(\"config_invalid: SOR_BASE_URL 은 http://\
                \ 또는 https:// 로 시작해야 한다\")\n    user = _txt(username).strip()\n  \
                \  if not user or \"CHANGE-ME\" in user.upper():\n        problems.append(\"\
                config_missing: SOR_USERNAME\")\n    if not problems:\n        return\
                \ \"\"\n    return (\"; \".join(problems) + \". 도구 설정의 환경변수를 채운 뒤\
                \ 다시 부른다. 데이터가 없는 것이 아니라 \"\n            \"설정 오류이므로 인자를 바꿔 다시 부르지\
                \ 않는다\")\n\n\ndef _q(value):\n    import urllib.parse\n    return\
                \ urllib.parse.quote(_txt(value), safe=\"\")\n\n\ndef _build_url(base_url,\
                \ path, params):\n    \"\"\"params 는 (이름, 값) 목록이다. 값은 전부 퍼센트 인코딩한다.\
                \ (url, query string 길이).\"\"\"\n    query = \"&\".join(_q(key) +\
                \ \"=\" + _q(value) for key, value in params)\n    return base_url\
                \ + path + (\"?\" + query if query else \"\"), len(query)\n\n\ndef\
                \ _abs_iri(text):\n    \"\"\"절대 IRI(http, https, urn)면 (IRI, \"\"\
                ), 아니면 (\"\", 사유).\"\"\"\n    raw = _txt(text).strip()\n    if raw.startswith(\"\
                <\") and raw.endswith(\">\") and len(raw) > 2:\n        raw = raw[1:-1].strip()\n\
                \    if not raw:\n        return \"\", \"비어 있다\"\n    lower = raw.lower()\n\
                \    ok = False\n    for scheme in (\"http://\", \"https://\", \"\
                urn:\"):\n        if lower.startswith(scheme) and len(raw) > len(scheme):\n\
                \            ok = True\n    if not ok:\n        return \"\", \"절대\
                \ IRI(http, https, urn)가 아니다\"\n    for ch in (\"<\", \">\", '\"',\
                \ \" \", \"\\t\", \"\\n\", \"\\r\", \"{\", \"}\", \"|\", \"^\", \"\
                `\", \"\\\\\"):\n        if ch in raw:\n            return \"\", \"\
                IRI 에 쓸 수 없는 문자가 있다\"\n    return raw, \"\"\n\n\ndef _stop(warning,\
                \ repository, extra):\n    \"\"\"호출 없이 끝낼 때의 응답.\"\"\"\n    payload\
                \ = {\"status\": \"error\", \"repository\": _txt(repository), \"repository_candidates\"\
                : [],\n               \"warning\": warning}\n    payload.update(extra)\n\
                \    return payload\n\n\ndef _lit(text):\n    \"\"\"SPARQL 문자열 literal\
