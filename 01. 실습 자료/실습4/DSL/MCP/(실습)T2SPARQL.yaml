                  status: error
                  warning: 'response_processing_failed: 서버 응답을 정리하는 단계가 실패했다. 다시 부르지
                    말고 관리자에게 알린다'
              retry_config:
                retry_enabled: false
                max_retries: 3
                retry_interval: 300
