          \ = 3000\n    ANCHOR = 40\n    EXCERPT = 300\n    MATCHED_MAX = 2\n    TARGET\
          \ = 7800\n    SHRINK_STEPS = 3\n\n    payload = {\"status\": \"\", \"results\"\
          : [], \"result_count\": 0, \"warning\": \"\"}\n    info = [text for text\
          \ in [str(input_warning or \"\").strip()] if text]\n\n    if _to_int(qvec_dims)\
          \ <= 0:\n        payload[\"status\"] = \"error\"\n        payload[\"warning\"\
          ] = \"; \".join([_wtext(\"embedding_unavailable\")] + info)\n        return\
          \ {\"payload\": payload}\n    error_text = str(search_error or \"\").strip()\n\
          \    if error_text:\n        payload[\"status\"] = \"error\"\n        payload[\"\
          warning\"] = \"; \".join([_wtext(\"search_failed\", code=error_text)] +\
          \ info)\n        return {\"payload\": payload}\n    rows = [row for row\
          \ in (sections if isinstance(sections, list) else []) if isinstance(row,\
          \ dict)]\n    if not rows or _to_int(hit_count) <= 0:\n        payload[\"\
          status\"] = \"no_results\"\n        code = \"document_id_no_match\" if _to_int(has_doc_filter)\
          \ else \"no_results\"\n        payload[\"warning\"] = \"; \".join([_wtext(code)]\
          \ + info)\n        return {\"payload\": payload}\n\n    mget_data = _parse_json(mget_body)\n\
          \    fetch_failed = _http_failed(mget_status, mget_data)\n    parents =\
          \ {}\n    if not fetch_failed:\n        docs = mget_data.get(\"docs\")\n\
          \        for doc in (docs if isinstance(docs, list) else []):\n        \
          \    if isinstance(doc, dict) and doc.get(\"found\") and isinstance(doc.get(\"\
          _source\"), dict):\n                parents[str(doc.get(\"_id\") or \"\"\
          )] = doc[\"_source\"]\n\n    items = []\n    missing = 0\n    for row in\
          \ rows:\n        parent_id = str(row.get(\"parent_chunk_id\") or \"\")\n\
          \        src = parents.get(parent_id) if parent_id else None\n        if\
          \ isinstance(src, dict):\n            items.append({\"row\": row, \"body\"\
          : str(src.get(\"content\") or \"\"), \"source\": \"parent\",\n         \
          \                 \"chunk_id\": parent_id, \"page_start\": _to_int(src.get(\"\
          page_start\")),\n                          \"page_end\": _to_int(src.get(\"\
          page_end\")),\n                          \"title\": str(src.get(\"title\"\
          ) or row.get(\"title\") or \"\")})\n        else:\n            missing +=\
          \ 1\n            items.append({\"row\": row, \"body\": str(row.get(\"child_content\"\
          ) or \"\"), \"source\": \"child\",\n                          \"chunk_id\"\
          : str(row.get(\"child_id\") or \"\"),\n                          \"page_start\"\
          : _to_int(row.get(\"child_page_start\")),\n                          \"\
          page_end\": _to_int(row.get(\"child_page_end\")),\n                    \
          \      \"title\": str(row.get(\"title\") or \"\")})\n\n    def build(width):\n\
          \        out = []\n        for item in items:\n            row = item[\"\
          row\"]\n            text, offset, truncated, child_excerpt = _excerpt(\n\
          \                item[\"body\"], str(row.get(\"child_content\") or \"\"\
          ), width, ANCHOR, EXCERPT)\n            matched = row.get(\"matched_child_ids\"\
          ) if isinstance(row.get(\"matched_child_ids\"), list) else []\n        \
          \    score = row.get(\"score\")\n            out.append({\"document_id\"\
          : str(row.get(\"document_id\") or \"\"),\n                        \"title\"\
          : item[\"title\"],\n                        \"chunk_id\": item[\"chunk_id\"\
          ],\n                        \"section_chunk_id\": str(row.get(\"parent_chunk_id\"\
          ) or \"\"),\n                        \"page_start\": item[\"page_start\"\
          ],\n                        \"page_end\": item[\"page_end\"],\n        \
          \                \"text\": text,\n                        \"text_offset\"\
          : offset,\n                        \"section_chars\": len(item[\"body\"\
          ]),\n                        \"truncated\": truncated,\n               \
          \         \"body_source\": item[\"source\"],\n                        \"\
          matched_child_ids\": [str(value) for value in matched[:MATCHED_MAX]],\n\
          \                        \"child_excerpt\": child_excerpt,\n           \
          \             \"score\": score if isinstance(score, (int, float)) else 0})\n\
          \        return out\n\n    notes = []\n    if fetch_failed:\n        notes.append(_wtext(\"\
