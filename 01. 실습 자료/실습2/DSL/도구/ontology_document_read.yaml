app:
  description: 색인된 문서 목록을 확인하거나 선택한 문서의 내용을 섹션 순서대로 조회
  icon: ri-git-merge-line
  icon_background: '#14b8a6'
  mode: workflow
  name: ontology_document_read
  type: agent
  use_icon_as_answer_icon: false
dependencies:
  code_agents: []
  knowledges: []
  node_configs: []
  single_agents: []
  skills: []
  workflow_apps: []
  workflow_mcp_servers: []
  workflow_tools: []
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: Elasticsearch 주소. 끝에 슬래시를 붙이지 않는다
    id: 47221646-da7c-e90a-f0ac-fa04e3c38d06
    name: ES_BASE_URL
    selector:
    - env
    - ES_BASE_URL
    value: http://192.168.250.101:19200
    value_type: string
  - description: 표준 계층 색인 v2.0 KB 인덱스명. 단일 인덱스 또는 단일 인덱스를 가리키는 alias
    id: baded43b-f365-53d5-72ef-ddde34ef82ad
    name: ES_INDEX
    selector:
    - env
    - ES_INDEX
    value: manufacturing_erp
    value_type: string
  - description: Authorization 헤더 값(ApiKey ... 또는 Basic ...). 인증 없는 ES 면 빈 문자열. secret
      이라 DSL 을 내보내면 값이 비워진다
    id: 6fd13c7c-f68b-693e-7473-ec0e656b0709
    name: ES_AUTH_HEADER
    selector:
    - env
    - ES_AUTH_HEADER
    value: ''
    value_type: secret
  - description: 다중 테넌트 색인의 tenant_id 값. 빈 문자열이면 tenant 조건을 걸지 않는다
    id: 5affa868-a237-b703-9e1c-e27ef9172cfb
    name: TENANT_ID
    selector:
    - env
    - TENANT_ID
    value: ''
    value_type: string
  features:
    file_upload:
      image:
        detail: high
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: code
      id: start-source-prep-target
      label: ''
      source: start
      sourceHandle: source
      target: prep
      targetHandle: target
      type: custom
    - data:
        sourceType: http-request
        targetType: code
      id: root-source-pick-target
      label: ''
      selected: false
      source: root
      sourceHandle: source
      target: pick
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: http-request
      id: pick-source-read-target
      label: ''
      selected: false
      source: pick
      sourceHandle: source
      target: read
      targetHandle: target
      type: custom
    - data:
        sourceType: http-request
        targetType: code
      id: read-source-shape-target
      label: ''
      selected: false
      source: read
      sourceHandle: source
      target: shape
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: if-else
      id: prep-source-gate-target
      label: ''
      source: prep
      sourceHandle: source
      target: gate
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: http-request
      id: gate-ok-root-target
      label: ''
      source: gate
      sourceHandle: ok
      target: root
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: code
      id: gate-false-precheck_fail-target
      label: ''
      source: gate
      sourceHandle: 'false'
      target: precheck_fail
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: variable-aggregator
      id: shape-source-merge-target
      label: ''
      selected: false
      source: shape
      sourceHandle: source
      target: merge
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: variable-aggregator
      id: precheck_fail-source-merge-target
      label: ''
      selected: false
      source: precheck_fail
      sourceHandle: source
      target: merge
      targetHandle: target
      type: custom
    - data:
        sourceType: variable-aggregator
        targetType: code
      id: merge-source-unpack-target
      label: ''
      selected: false
      source: merge
      sourceHandle: source
      target: unpack
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: end
      id: unpack-source-done-target
      label: ''
      selected: false
      source: unpack
      sourceHandle: source
      target: done
      targetHandle: target
      type: custom
    nodes:
    - computedPosition:
        x: 80
        y: 140
        z: 0
      data:
        desc: document_hint 와 position 을 받는다. 둘 다 선택이며 인덱스명과 주소는 환경변수다
        display_variables:
        - document_hint
        - position
        retry_config:
          max_retries: 3
          retry_enabled: false
          retry_interval: 300
        title: 인자 받기
        type: start
        variables:
        - default: ''
          description: '읽을 문서의 문서명 단서 또는 document_id 다. 두 인자를 모두 비우면 문서 목록을 돌려준다.
            문서명 단서는 제목에 들어 있는 낱말이며, 넣은 낱말이 모두 제목에 있어야 그 문서로 확정된다. 앞선 결과에서 고른 문서라면
            document_id 를 그대로 넣는 것이 가장 확실하다. position 을 넣으면 이 값은 쓰지 않는다. 예시 1: 시립
            도서관 이용 규정. 예시 2: doc-2026-library-rules-001. 사용자가 말한 단서나 앞선 도구 결과의 값을
            그대로 쓰고 문서 이름을 지어내지 않는다.'
          label: 문서명 단서
          required: false
          type: text-input
          variable: document_hint
        - default: ''
          description: '읽기 시작 위치다. 앞 호출이 돌려준 next_position 또는 prev_position 값, 또는
            검색 결과의 section_chunk_id 값을 한 글자도 바꾸지 않고 넣는다. 비우면 문서 처음부터 읽고, 문서 목록이면 첫
            목록부터 돌려준다. child 층 chunk_id(:child: 가 든 값)는 받지 않는다. 예시 1: doc-2026-library-rules-001:v3:parent:0004.
            예시 2: doc-2026-library-rules-001:v3:parent:0004@2870. 도구가 돌려준 값을 그대로 쓰고
            위치 값을 직접 만들거나 숫자를 고치지 않는다.'
          label: 읽기 위치
          required: false
          type: text-input
          variable: position
      dimensions:
        height: 164
        width: 280
      dragging: false
      events: {}
      handleBounds:
        source:
        - height: 8
          id: source
          nodeId: start
          position: right
          type: source
          width: 8
          x: 276.9997930328814
          y: 23.000019038406233
        target: null
      id: start
      initialized: false
      isParent: false
      position:
        x: 80
        y: 140
      resizing: false
      selected: false
      type: custom
    - computedPosition:
        x: 460
        y: 140
        z: 0
      data:
        code: "\nWARN = {'no_targets': ['단서나 읽기 위치에 맞는 문서를 찾지 못했다(지금 조회 가능한 후보: {candidates})',\
          \ '후보의 document_id 하나를 document_hint 에 넣어 한 번만 다시 호출하거나, 두 인자를 비워 목록을 확인한다.\
          \ 같은 단서로 다시 호출하지 않는다'], 'ambiguous': ['단서가 문서 {n}건과 일치한다. 후보는 documents\
          \ 에 있다', '뜻한 문서의 document_id 를 document_hint 에 넣어 한 번만 다시 호출하고, 고를 수 없으면\
          \ 사용자에게 묻는다'], 'no_results': ['조회 가능한 문서가 하나도 없다', 'ES_INDEX 와 TENANT_ID\
          \ 설정이 맞는지 사용자에게 확인한다'], 'position_out_of_range': ['읽기 위치가 문서나 목록의 끝을 넘었다',\
          \ 'position 을 비우고 처음부터 다시 호출한다'], 'section_layer_missing': ['이 문서에 parent\
          \ 섹션이 없다', 'abox_search_keyword 나 abox_search_semantic 에 이 document_id 를\
          \ 넣어 검색한다'], 'position_invalid': ['position 형식이 틀렸거나 child 층 chunk_id 다',\
