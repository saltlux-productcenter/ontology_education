          \ 에서 읽었다(읽기 위치 {old}, 현재 {new})', '앞 결과와 내용이 이어지는지 확인하고, 어긋나면 position 을\
          \ 비워 처음부터 읽는다'], 'result_trimmed': ['결과 길이 상한 8,000자에 맞춰 뒤쪽 항목을 빼거나 섹션을\
          \ 더 짧게 잘랐다(줄인 항목 {n}건)', 'next_position 을 position 에 넣어 이어 읽는다'], 'search_failed':\
          \ ['ES 조회가 실패했다(HTTP {code})', '한 번만 다시 호출하고, 또 실패하면 사용자에게 알린다'], 'es_base_url_missing':\
          \ ['환경변수 ES_BASE_URL 가 비었거나 CHANGE-ME 로 남아 있어 조회하지 않았다', '이것은 색인에 자료가 없는\
          \ 것이 아니라 설정 오류다. 다시 호출하지 말고 사용자에게 알린다'], 'es_index_missing': ['환경변수 ES_INDEX\
          \ 가 비었거나 CHANGE-ME 로 남아 있어 조회하지 않았다', '이것은 색인에 자료가 없는 것이 아니라 설정 오류다. 다시\
          \ 호출하지 말고 사용자에게 알린다'], 'es_auth_header_missing': ['환경변수 ES_AUTH_HEADER 가\
          \ CHANGE-ME 로 남아 있어 조회하지 않았다', '이것은 색인에 자료가 없는 것이 아니라 설정 오류다. 다시 호출하지 말고\
          \ 사용자에게 알린다'], 'tenant_id_missing': ['환경변수 TENANT_ID 가 CHANGE-ME 로 남아 있어\
          \ 조회하지 않았다', '이것은 색인에 자료가 없는 것이 아니라 설정 오류다. 다시 호출하지 말고 사용자에게 알린다']}\n\n\n\
          def _to_int(value):\n    try:\n        return int(value)\n    except Exception:\n\
          \        return 0\n\n\ndef _parse_json(raw):\n    import json\n    if isinstance(raw,\
          \ (dict, list)):\n        return raw\n    if not raw:\n        return None\n\
          \    try:\n        return json.loads(raw)\n    except Exception:\n     \
          \   return None\n\n\ndef _http_failed(status_code, data):\n    code = _to_int(status_code)\n\
          \    return code == 0 or code >= 400 or not isinstance(data, dict)\n\n\n\
          def _hits_of(data):\n    if not isinstance(data, dict):\n        return\
          \ []\n    outer = data.get(\"hits\")\n    inner = outer.get(\"hits\") if\
          \ isinstance(outer, dict) else None\n    return inner if isinstance(inner,\
          \ list) else []\n\n\ndef _total_of(data):\n    if not isinstance(data, dict):\n\
          \        return 0\n    outer = data.get(\"hits\")\n    total = outer.get(\"\
          total\") if isinstance(outer, dict) else None\n    if isinstance(total,\
          \ dict):\n        return _to_int(total.get(\"value\"))\n    return _to_int(total)\n\
          \n\ndef _wtext(code, **values):\n    pair = WARN.get(code) or [\"\", \"\"\
          ]\n    fact = pair[0]\n    for key, value in values.items():\n        fact\
          \ = fact.replace(\"{\" + key + \"}\", str(value))\n    text = code + \"\
          : \" + fact\n    if pair[1]:\n        text = text + \". \" + pair[1]\n \
          \   return text\n\n\ndef _size(payload):\n    import json\n    return len(json.dumps(payload,\
          \ ensure_ascii=False))\n\nCONFIG_CHECKS = [['es_base_url', 'es_base_url_missing',\
          \ True], ['es_index', 'es_index_missing', True], ['es_auth_header', 'es_auth_header_missing',\
          \ False], ['tenant_id', 'tenant_id_missing', False]]\n\n\ndef _config_error(values):\n\
          \    missing = []\n    for name, code, empty_is_unset in CONFIG_CHECKS:\n\
          \        raw = values.get(name)\n        text = str(raw if raw is not None\
          \ else \"\").strip()\n        if (not text and empty_is_unset) or text.startswith(\"\
          CHANGE-ME\"):\n            missing.append(_wtext(code))\n    return \";\
          \ \".join(missing)\n\n\ndef _level_filters(level, tenant_id):\n    filters\
          \ = [{\"term\": {\"chunk_level\": level}},\n               {\"term\": {\"\
          is_latest\": True}},\n               {\"term\": {\"lifecycle_state\": \"\
          active\"}}]\n    tenant = str(tenant_id if tenant_id is not None else \"\
          \").strip()\n    if tenant and not tenant.startswith(\"CHANGE-ME\"):\n \
          \       filters.append({\"term\": {\"tenant_id\": tenant}})\n    return\
          \ filters\n\nDOCS_RE = r\"^#docs:(\\d+)$\"\nPOS_RE = r\"^(?P<doc>.+):v(?P<ver>\\\
          d+):(?P<lvl>root|parent|child):(?P<ord>\\d+)(?:@(?P<off>\\d+))?$\"\n\n\n\
          def main(document_hint, position, es_base_url, es_index, es_auth_header,\
          \ tenant_id):\n    import re\n    import unicodedata\n\n    hint = str(document_hint\
          \ if document_hint is not None else \"\").strip()\n    pos = str(position\
          \ if position is not None else \"\").strip()\n    config_error = _config_error({\"\
          es_base_url\": es_base_url, \"es_index\": es_index,\n                  \
          \                \"es_auth_header\": es_auth_header, \"tenant_id\": tenant_id})\n\
          \    root_filters = _level_filters(\"root\", tenant_id)\n    parent_filters\
          \ = _level_filters(\"parent\", tenant_id)\n    hint_norm = re.sub(r\"\\\
          s+\", \" \", unicodedata.normalize(\"NFKC\", hint)).strip().casefold()\n\
          \n    warnings = []\n    arg_error = \"\"\n    mode = \"list\"\n    root_from\
          \ = 0\n    pos_doc_id = \"\"\n    pos_version = 0\n    pos_order = -1\n\
          \    pos_offset = 0\n    if pos:\n        if hint:\n            warnings.append(_wtext(\"\
          document_hint_ignored\"))\n        docs_match = re.match(DOCS_RE, pos)\n\
          \        pos_match = None if docs_match else re.match(POS_RE, pos)\n   \
          \     if docs_match:\n            root_from = int(docs_match.group(1))\n\
          \        elif pos_match and pos_match.group(\"lvl\") != \"child\":\n   \
          \         mode = \"position\"\n            pos_doc_id = pos_match.group(\"\
          doc\")\n            pos_version = int(pos_match.group(\"ver\"))\n      \
          \      if pos_match.group(\"lvl\") == \"parent\":\n                pos_order\
          \ = int(pos_match.group(\"ord\"))\n                pos_offset = int(pos_match.group(\"\
          off\") or 0)\n        else:\n            mode = \"\"\n            arg_error\
          \ = _wtext(\"position_invalid\")\n    elif hint:\n        mode = \"hint\"\
          \n\n    title_sort = [{\"title\": \"asc\"}, {\"document_id\": \"asc\"}]\n\
          \    score_sort = [{\"_score\": \"desc\"}, {\"title\": \"asc\"}, {\"document_id\"\
          : \"asc\"}]\n    if mode == \"hint\":\n        root_query = {\"bool\": {\n\
          \            \"filter\": root_filters,\n            \"should\": [\n    \
          \            {\"term\": {\"document_id\": {\"value\": hint, \"boost\": 100,\
          \ \"_name\": \"id\"}}},\n                {\"multi_match\": {\"query\": hint,\
          \ \"fields\": [\"title.nori\", \"title\"],\n                           \
          \      \"type\": \"best_fields\", \"operator\": \"and\", \"lenient\": True,\n\
          \                                 \"boost\": 10, \"_name\": \"strict\"}},\n\
          \                {\"multi_match\": {\"query\": hint, \"fields\": [\"title.nori\"\
          , \"title\"],\n                                 \"type\": \"best_fields\"\
          , \"operator\": \"or\", \"lenient\": True,\n                           \
          \      \"_name\": \"loose\"}},\n            ],\n            \"minimum_should_match\"\
          : 0}}\n        root_sort = score_sort\n    elif mode == \"position\":\n\
          \        root_query = {\"bool\": {\n            \"filter\": root_filters,\n\
          \            \"should\": [{\"term\": {\"document_id\": {\"value\": pos_doc_id,\
          \ \"_name\": \"id\"}}}],\n            \"minimum_should_match\": 0}}\n  \
          \      root_sort = score_sort\n    else:\n        root_query = {\"bool\"\
          : {\"filter\": root_filters}}\n        root_sort = title_sort\n\n    return\
          \ {\"mode\": mode, \"root_query\": root_query, \"root_sort\": root_sort,\
          \ \"root_from\": root_from,\n            \"pos_doc_id\": pos_doc_id, \"\
          pos_version\": pos_version, \"pos_order\": pos_order,\n            \"pos_offset\"\
          : pos_offset, \"hint_norm\": hint_norm, \"parent_filters\": parent_filters,\n\
          \            \"input_warning\": \"; \".join(warnings), \"config_error\"\
          : config_error,\n            \"arg_error\": arg_error}\n"
        code_language: python3
